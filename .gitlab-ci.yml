image: debian:trixie-slim

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHON_VERSION: "3.12"
  NPM_CACHE_DIR: "$CI_PROJECT_DIR/.cache/npm"

stages:
  - test
  - build
  - image
  - release

test:
  stage: test
  before_script:
    - apt-get update && apt-get install -y python3 python3-pip python3-venv git sqlite3 procps
    - git config --global user.email "ci@pyops.local"
    - git config --global user.name "PyOps CI"
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install psutil fastapi uvicorn sqlalchemy pyzmq msgpack croniter jedi requests zipstream-ng gunicorn pyyaml pytest httpx pytest-cov debugpy
  script:
    - source .venv/bin/activate
    - ./test.sh
    - tar -czf venv.tar.gz .venv
  artifacts:
    when: on_success
    paths:
      - venv.tar.gz
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
      when: always
    - when: manual

test:e2e:
  stage: test
  image: node:24-trixie-slim
  before_script:
    - apt-get update && apt-get install -y python3 python3-pip python3-venv python3-argcomplete git sqlite3 procps
    - git config --global user.email "ci@pyops.local"
    - git config --global user.name "PyOps CI"
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install psutil fastapi uvicorn sqlalchemy pyzmq msgpack croniter jedi requests zipstream-ng gunicorn pyyaml pytest httpx pytest-cov debugpy pytest-playwright pytest-base-url
    - playwright install --with-deps chromium
  script:
    - source .venv/bin/activate
    - pytest tests/e2e/ tests/pyopsctl/e2e/ -v
  variables:
    E2E_STARTUP_TIMEOUT: "60"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
      when: always
    - when: manual

test:e2e:vsix:
  stage: test
  image: node:24-trixie-slim
  before_script:
    # Python + server dependencies
    - apt-get update && apt-get install -y python3 python3-pip python3-venv git sqlite3 curl procps
    # Electron/VS Code runtime dependencies + Xvfb
    - apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1 libgtk-3-0 libasound2t64 libxshmfence1
    - git config --global user.email "ci@pyops.local"
    - git config --global user.name "PyOps CI"
    # Setup Python venv and install server
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install psutil fastapi uvicorn sqlalchemy pyzmq msgpack croniter jedi requests zipstream-ng gunicorn pyyaml debugpy
    # Setup VSIX
    - npm config set cache $NPM_CACHE_DIR
    - cd vsix && npm ci && cd ..
  script:
    - source .venv/bin/activate
    # Start PyOps server in background
    - gunicorn -c app/gunicorn.py --access-logfile - --error-logfile - --capture-output &
    - |
      for i in $(seq 1 60); do
        if curl -sf http://localhost:8000 > /dev/null 2>&1; then break; fi
        sleep 1
      done
    - "curl -sf http://localhost:8000 > /dev/null || { echo 'Server failed to start'; exit 1; }"
    # Run the VSIX e2e suite (real extension host vs real server) under Xvfb
    - xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" npm run test:e2e --prefix vsix/
  variables:
    PYOPS_SERVER_URL: "http://localhost:8000"
    PYOPS_JOB_STATE_TIMEOUT: "30000"
  cache:
    paths:
      - vsix/node_modules/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
      when: always
    - when: manual

test:vsix:
  stage: test
  image: node:24-trixie-slim
  cache:
    paths:
      - vsix/node_modules/
  before_script:
    - npm config set cache $NPM_CACHE_DIR
  script:
    - cd vsix
    - npm ci
    - npm run test
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
      when: always
    - when: manual

# pyopsctl unit + integration tests. pyopsctl runs without a venv on the
# operator's host, so this stage mirrors that: distribution python3 +
# distribution python3-requests, no pip-installed extras for the CLI
# itself. The integration tests still need pytest (plus the pyops server
# deps), so we install those into the test venv as before.
test:pyopsctl:
  stage: test
  before_script:
    - apt-get update && apt-get install -y python3 python3-pip python3-venv python3-requests python3-argcomplete git sqlite3 procps
    - git config --global user.email "ci@pyops.local"
    - git config --global user.name "PyOps CI"
    - python3 -m venv .venv --system-site-packages
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install psutil fastapi uvicorn sqlalchemy pyzmq msgpack croniter jedi requests zipstream-ng gunicorn pyyaml pytest httpx pytest-cov debugpy
  script:
    - source .venv/bin/activate
    # E2E pyopsctl tests run in `test:e2e`. This stage covers
    # unit + integration only.
    - pytest tests/pyopsctl/unit tests/pyopsctl/integration -v
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
      when: always
    - when: manual

build:
  stage: build
  needs: [test, test:vsix]
  image: node:24-trixie-slim
  cache:
    paths:
      - vsix/node_modules/
  before_script:
    - npm config set cache $NPM_CACHE_DIR
  script:
    - vsix/build.sh
  artifacts:
    when: on_success
    paths:
      - vsix/*.vsix
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
      when: always
    - when: manual

# pyopsctl Debian binary package. Built with plain `dpkg-deb` — no
# debhelper, no fpm — so the only build-host deps are dpkg-dev and
# python3-argcomplete (for the bundled zsh/bash completion files).
# Targets Ubuntu 24.04 (noble) and Debian 13 (trixie) as the floor;
# the Depends line pins python3 (>= 3.12) accordingly.
build:pyopsctl:
  stage: build
  needs: [test:pyopsctl]
  before_script:
    - apt-get update
    - apt-get install -y dpkg-dev python3-argcomplete python3-requests
  script:
    - ./ctl/build.sh
  artifacts:
    when: on_success
    paths:
      - ctl/dist/*.deb
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
      when: always
    - when: manual

# Install the .deb produced by build:pyopsctl in a clean apt
# environment and smoke-test the result. Catches breakage that
# `dpkg-deb -x` extraction misses: Depends resolution, dpkg triggers
# (py3compile, bash-completion hook), the launcher running without
# PYTHONPATH overrides, and zsh's compinit picking up the system
# completion file from the apt-managed $fpath path.
test:pyopsctl:install:
  stage: build
  needs: [build:pyopsctl]
  before_script:
    - apt-get update
    - apt-get install -y zsh
  script:
    # apt resolves Depends + Recommends from the deb (python3,
    # python3-requests, python3-argcomplete).
    - apt-get install -y ./ctl/dist/pyopsctl_*.deb
    # Launcher must be at /usr/bin and run without any sys.path tricks.
    - test "$(command -v pyopsctl)" = /usr/bin/pyopsctl
    - pyopsctl --help > /dev/null
    # The argparse-level --version flag prints the cli version and
    # exits before config resolution, so it works without a profile
    # (CI has none). Proves the baked _version.py is the one being
    # imported — a "0.0.0+unknown" fallback would fail the match.
    # The `pyopsctl version` SUBCOMMAND queries the server too and
    # needs a profile, so it's the wrong probe for a build-artifact
    # smoke test.
    - VERSION=$(tr -d '[:space:]' < VERSION)
    - "pyopsctl --version | grep -Fx \"pyopsctl ${VERSION}\""
    # argcomplete protocol: with the env vars set the launcher should
    # emit the top-level group names on fd 8. If the marker comment is
    # missing or the autocomplete call regresses, this is silent.
    - >
      _ARGCOMPLETE=1 _ARGCOMPLETE_SHELL=bash _ARGCOMPLETE_IFS=$'\n'
      COMP_TYPE=9 COMP_LINE='pyopsctl ' COMP_POINT=9
      pyopsctl 8>&1 9>&2 1>/dev/null 2>&1 | grep -q '^scriptlet$'
    # Both completion files must land at the apt-managed system paths
    # so apt-installed users get tab completion without any rc edit.
    - test -f /usr/share/bash-completion/completions/pyopsctl
    - test -f /usr/share/zsh/vendor-completions/_pyopsctl
    # zsh compinit must register the pyopsctl completion from $fpath
    # (i.e. the file is named correctly and starts with #compdef).
    - >
      zsh -c 'autoload -Uz compinit; compinit -u 2>/dev/null;
      (( ${+_comps[pyopsctl]} )) || { echo "compinit did not register pyopsctl"; exit 1; }'
    # Clean uninstall: every shipped file gone afterwards.
    - apt-get remove -y pyopsctl
    - test ! -e /usr/bin/pyopsctl
    - test ! -e /usr/share/bash-completion/completions/pyopsctl
    - test ! -e /usr/share/zsh/vendor-completions/_pyopsctl
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
      when: always
    - when: manual


# Block merges that forgot to bump VERSION. Runs only for MRs targeting
# main — on main itself the merged commit's VERSION is the new release
# line and the check would self-defeat. Sits in the build stage so it
# runs after the test stage is green; nothing useful comes of telling
# the author "bump the version" while tests are red anyway.
#
# Asserts four things:
#   1. VERSION isn't already a released tag (the actual "forgot to bump"
#      symptom).
#   2. vsix/package.json version == VERSION.
#   3. vsix/package-lock.json top-level + ""-entry versions == VERSION
#      (npm rewrites both on `npm version`; manual bumps tend to miss
#      one).
#   4. CHANGELOG.md has a `## [<VERSION>]` heading so the release notes
#      are written before merge, not afterwards.
verify:version_bumped:
  stage: build
  needs: []
  # alpine/git defaults its ENTRYPOINT to `git`, so the GitLab runner's
  # `sh -c '...'` script trampoline ends up as `git sh -c '...'` and dies
  # with `git: 'sh' is not a git command`. Clearing the entrypoint lets
  # the runner exec `sh` itself; `git` is still on PATH from the image.
  image:
    name: alpine/git
    entrypoint: [""]
  before_script:
    - apk add --no-cache grep
  script:
    - VERSION=$(tr -d '[:space:]' < VERSION)
    - echo "VERSION = $VERSION"
    - git fetch --tags --quiet
    - |
      if git rev-parse "v$VERSION" >/dev/null 2>&1; then
        echo "ERROR: VERSION ($VERSION) matches existing tag v$VERSION."
        echo "Bump VERSION (and vsix/package.json + vsix/package-lock.json)"
        echo "and add a '## [$VERSION] — YYYY-MM-DD' section to CHANGELOG.md"
        echo "before merging."
        exit 1
      fi
    - |
      VSIX_PKG=$(grep -m1 '"version"' vsix/package.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
      if [ "$VSIX_PKG" != "$VERSION" ]; then
        echo "ERROR: vsix/package.json version ($VSIX_PKG) does not match VERSION ($VERSION)"
        exit 1
      fi
    - |
      VSIX_LOCK_TOP=$(grep -m1 '"version"' vsix/package-lock.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
      VSIX_LOCK_PKG=$(grep -m2 '"version"' vsix/package-lock.json | tail -1 | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
      if [ "$VSIX_LOCK_TOP" != "$VERSION" ] || [ "$VSIX_LOCK_PKG" != "$VERSION" ]; then
        echo "ERROR: vsix/package-lock.json versions (top=$VSIX_LOCK_TOP, pkg=$VSIX_LOCK_PKG) do not match VERSION ($VERSION)"
        exit 1
      fi
    - |
      if ! grep -qE "^## \[$VERSION\]" CHANGELOG.md; then
        echo "ERROR: CHANGELOG.md has no '## [$VERSION]' heading."
        echo "Add a release section for $VERSION before merging."
        exit 1
      fi
    - 'echo "OK: VERSION $VERSION is bumped, vsix files agree, CHANGELOG has a $VERSION section."'
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
      when: on_success

# Multi-arch container image build. Runs `./build.sh` which reads VERSION
# and pushes :VERSION + :MAJOR + :MINOR + :latest + tagless to
# registry.ralph.or.at/pyops/pyops — automatically on every main pipeline.
# The predefined job-token credentials (CI_REGISTRY_USER / CI_REGISTRY_PASSWORD)
# may push to the project's own registry; no extra CI/CD variables needed.
#
# Host requirements on the runner (graz-2 — see /srv/docker02/gitlab/README.md):
#   1. ARM64 emulation for the multi-arch buildx step: qemu-user-static +
#      binfmt-support are installed there; the docker-container builder would
#      also emulate arm64 without them (BuildKit ships its own QEMU)
#   2. /var/run/docker.sock mounted into job containers via runner config
#      volumes — required because the runner runs with privileged=false so
#      docker:dind is not an option, we share the host docker daemon instead
build:image:
  stage: image
  needs: [build]
  image: docker:latest
  before_script:
    - apk add --no-cache bash
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin registry.ralph.or.at
  script:
    - ./build.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# Dev image of every non-main build: `./build.sh dev` builds the same
# multi-arch image and pushes only registry.ralph.or.at/pyops/pyops:dev
# (never :latest or version tags). Starts right away (needs: []) so a
# Dockerfile change that breaks the image fails the pipeline early.
# Automatic in MR pipelines targeting main, manual on other branches like the
# other jobs, never on main (build:image publishes the release there).
build:image:dev:
  stage: image
  needs: []
  image: docker:latest
  before_script:
    - apk add --no-cache bash
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin registry.ralph.or.at
  script:
    - ./build.sh dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: never
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - when: manual

# Tags the current main HEAD with vVERSION, uploads the VSIX as a Generic
# Package, and creates a GitLab Release linking back to it. Manual — the
# operator triggers this AFTER the image stage so the registry tag and the
# git tag stay in sync and the Docker reference in the release notes is
# valid.
#
# Requires CI/CD variable CI_PUSH_TOKEN — a Project Access Token with the
# write_repository scope. Without it the git push of the tag fails.
release:
  stage: release
  needs: [build, build:image, build:pyopsctl]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script:
    - apk add --no-cache bash git curl
  script:
    - VERSION=$(tr -d '[:space:]' < VERSION)
    - VSIX_FILE=$(ls vsix/*.vsix | head -1)
    - VSIX_NAME=$(basename "$VSIX_FILE")
    - VSIX_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/pyops-vsix/$VERSION/$VSIX_NAME"
    - DEB_FILE=$(ls ctl/dist/pyopsctl_*.deb | head -1)
    - DEB_NAME=$(basename "$DEB_FILE")
    - DEB_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/pyops-pyopsctl/$VERSION/$DEB_NAME"
    # Upload both binary artifacts to project Generic Packages
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$VSIX_FILE" "$VSIX_URL"'
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$DEB_FILE" "$DEB_URL"'
    # Tag main HEAD with vVERSION and push back to GitLab
    - git config user.email "ci@pyops.local"
    - git config user.name "PyOps CI"
    - git tag "v$VERSION"
    - 'git push "https://oauth2:$CI_PUSH_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git" "v$VERSION"'
    # Create the Release object pinned to the new tag
    - |
      release-cli create \
        --tag-name "v$VERSION" \
        --description "Docker Image: registry.ralph.or.at/pyops/pyops:$VERSION" \
        --assets-link "{\"name\":\"PyOps VSCode Extension\",\"url\":\"$VSIX_URL\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"pyopsctl Debian package\",\"url\":\"$DEB_URL\",\"link_type\":\"package\"}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
