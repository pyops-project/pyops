image: debian:trixie-slim

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHON_VERSION: "3.12"
  NPM_CACHE_DIR: "$CI_PROJECT_DIR/.cache/npm"

stages:
  - test
  - build
  - image
  - release

test:
  stage: test
  before_script:
    - apt-get update && apt-get install -y python3 python3-pip python3-venv git sqlite3 procps
    - git config --global user.email "ci@pyops.local"
    - git config --global user.name "PyOps CI"
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install psutil fastapi uvicorn sqlalchemy pyzmq msgpack croniter jedi requests zipstream-ng gunicorn pytest httpx pytest-cov debugpy
  script:
    - source .venv/bin/activate
    - ./test.sh
    - tar -czf venv.tar.gz .venv
  artifacts:
    when: on_success
    paths:
      - venv.tar.gz
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
      when: always
    - when: manual

test:e2e:
  stage: test
  before_script:
    - apt-get update && apt-get install -y python3 python3-pip python3-venv git sqlite3 nodejs npm procps
    - git config --global user.email "ci@pyops.local"
    - git config --global user.name "PyOps CI"
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install psutil fastapi uvicorn sqlalchemy pyzmq msgpack croniter jedi requests zipstream-ng gunicorn pytest httpx pytest-cov debugpy pytest-playwright pytest-base-url
    - playwright install --with-deps chromium
  script:
    - source .venv/bin/activate
    - pytest tests/e2e/ -v
  variables:
    E2E_STARTUP_TIMEOUT: "60"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
      when: always
    - when: manual

test:vsix_integration:
  stage: test
  before_script:
    # Python + server dependencies
    - apt-get update && apt-get install -y python3 python3-pip python3-venv git sqlite3 nodejs npm curl procps
    # Electron/VS Code runtime dependencies + Xvfb
    - apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1 libgtk-3-0 libasound2t64 libxshmfence1
    - git config --global user.email "ci@pyops.local"
    - git config --global user.name "PyOps CI"
    # Setup Python venv and install server
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install psutil fastapi uvicorn sqlalchemy pyzmq msgpack croniter jedi requests zipstream-ng gunicorn debugpy
    # Setup VSIX
    - npm config set cache $NPM_CACHE_DIR
    - cd vsix && npm ci && cd ..
  script:
    - source .venv/bin/activate
    # Start PyOps server in background
    - gunicorn -c app/gunicorn.py --access-logfile - --error-logfile - --capture-output &
    - |
      for i in $(seq 1 60); do
        if curl -sf http://localhost:8000 > /dev/null 2>&1; then break; fi
        sleep 1
      done
    - "curl -sf http://localhost:8000 > /dev/null || { echo 'Server failed to start'; exit 1; }"
    # Run integration tests under Xvfb
    - xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" npm run test:integration --prefix vsix/
  variables:
    PYOPS_SERVER_URL: "http://localhost:8000"
    PYOPS_JOB_STATE_TIMEOUT: "30000"
  cache:
    paths:
      - vsix/node_modules/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
      when: always
    - when: manual

test:vsix:
  stage: test
  cache:
    paths:
      - vsix/node_modules/
  before_script:
    - apt-get update
    - apt-get install -y nodejs npm
    - npm config set cache $NPM_CACHE_DIR
  script:
    - cd vsix
    - npm ci
    - npm run test
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
      when: always
    - when: manual

build:
  stage: build
  needs: [test, test:vsix]
  cache:
    paths:
      - vsix/node_modules/
  before_script:
    - apt-get update
    - apt-get install -y nodejs npm
    - npm config set cache $NPM_CACHE_DIR
  script:
    - vsix/build.sh
  artifacts:
    when: on_success
    paths:
      - vsix/*.vsix
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
      when: always
    - when: manual

# Multi-arch container image build. Runs `./build.sh` which reads VERSION
# and pushes :VERSION + :MAJOR + :MINOR + :latest + tagless to
# registry.ralph.or.at/pyops/pyops. Manual trigger only — the operator goes
# into the pipeline after a main-merge and starts this when they actually
# want a published image.
#
# Host requirements on the runner (graz-2 — see /srv/docker02/gitlab/README.md):
#   1. qemu-user-static + binfmt-support installed → ARM64 emulation for the
#      multi-arch buildx step
#   2. /var/run/docker.sock mounted into job containers via runner config
#      volumes — required because the runner runs with privileged=false so
#      docker:dind is not an option, we share the host docker daemon instead
image:
  stage: image
  needs: [build]
  image: docker:latest
  before_script:
    - apk add --no-cache bash
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" registry.ralph.or.at
  script:
    - ./build.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

# Tags the current main HEAD with vVERSION, uploads the VSIX as a Generic
# Package, and creates a GitLab Release linking back to it. Manual — the
# operator triggers this AFTER the image stage so the registry tag and the
# git tag stay in sync and the Docker reference in the release notes is
# valid.
#
# Requires CI/CD variable CI_PUSH_TOKEN — a Project Access Token with the
# write_repository scope. Without it the git push of the tag fails.
release:
  stage: release
  needs: [build, image]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script:
    - apk add --no-cache bash git curl
  script:
    - VERSION=$(tr -d '[:space:]' < VERSION)
    - VSIX_FILE=$(ls vsix/*.vsix | head -1)
    - VSIX_NAME=$(basename "$VSIX_FILE")
    - PACKAGE_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/pyops-vsix/$VERSION/$VSIX_NAME"
    # Upload VSIX to project Generic Packages
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$VSIX_FILE" "$PACKAGE_URL"'
    # Tag main HEAD with vVERSION and push back to GitLab
    - git config user.email "ci@pyops.local"
    - git config user.name "PyOps CI"
    - git tag "v$VERSION"
    - 'git push "https://oauth2:$CI_PUSH_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git" "v$VERSION"'
    # Create the Release object pinned to the new tag
    - |
      release-cli create \
        --tag-name "v$VERSION" \
        --description "Docker Image: registry.ralph.or.at/pyops/pyops:$VERSION" \
        --assets-link "{\"name\":\"PyOps VSCode Extension\",\"url\":\"$PACKAGE_URL\",\"link_type\":\"package\"}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
