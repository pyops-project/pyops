<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

		<link rel="stylesheet" href="/files/css/bootstrap/bootstrap.min.css">
        <link rel="stylesheet" href="/files/css/material/material-icons.css">

        <script src="/files/js/jquery.min.js"></script>
        <script src="/files/js/js.cookie.min.js"></script>
        <script src="/files/js/bootstrap/bootstrap.bundle.min.js"></script>

        <script>
            const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
            function setTheme(e) {
                const body = document.body;
                const table = document.querySelector('table');
                if (e.matches) {
                    document.documentElement.setAttribute('data-bs-theme', 'dark');
                    body.classList.remove('bg-body');
                    body.classList.add('bg-dark');
                    if (table) {
                        table.classList.remove('table-secondary');
                        table.classList.add('table-dark');
                    }
                } else {
                    document.documentElement.setAttribute('data-bs-theme', 'light');
                    body.classList.remove('bg-dark');
                    body.classList.add('bg-body');
                    if (table) {
                        table.classList.remove('table-dark');
                        table.classList.add('table-secondary');
                    }
                }
            }
            mediaQuery.addEventListener('change', setTheme);
            $(document).ready(function() {
                setTheme(mediaQuery);
            });
        </script>

        <script>
            'use strict';

            function genActions(s) {
                return `
                    <button type="button" onclick="edit('${s.id}')" class="btn btn-warning p-0" data-testid="schedule-edit-${s.id}">
                        <span class="material-icons-round">edit</span>
                    </button>
                    <button type="button" onclick="del('${s.id}')" class="btn btn-danger p-0" data-testid="schedule-delete-${s.id}">
                        <span class="material-icons-round">delete</span>
                    </button>
                    <button type="button" onclick="${s.active ? 'deactivate' : 'activate'}('${s.id}')" class="btn btn-${s.active ? 'danger' : 'success'} p-0" data-testid="schedule-toggle-${s.id}">
                        <span class="material-icons-round">${s.active ? 'airplanemode_inactive' : 'airplanemode_active'}</span>
                    </button>
                    <button type="button" onclick="run('${s.id}')" class="btn btn-success p-0" data-testid="schedule-run-${s.id}">
                        <span class="material-icons-round">play_arrow</span>
                    </button>
                    <button type="button" onclick="copyParam('${s.id}')" class="btn btn-danger p-0" data-testid="schedule-copy-${s.id}">
                        <span class="material-icons-round">copy_all</span>
                    </button>
                `
            }

            function genScheduleRowContent(s) {
                return `
                    <th scope="row">${s.id}</th>
                    <th scope="row">${s.set}</th>
                    <th scope="row">${s.name}</th>
                    <th scope="row">${s.drop_done}</th>
                    <td>${s.max_retries}</td>
                    <td>${s.schedule}</td>
                    <td>${s.last}</td>
                    <td>${genActions(s)}</td>
                    <td id="param_${s.id}" style="display:none;">${s.param}</td>
                `;
            }

            function getRowKey(row) {
                return $(row).data("id");
            }

            function genScheduleItem(s) {
                return `<tr data-id="${s.id}" data-testid="schedule-row-${s.id}">${genScheduleRowContent(s)}</tr>`;
            }

            function copyParam(id) {
                const param = $(`#param_${id}`).text();
                navigator.clipboard.writeText(param);
            }

            function refreshList() {
                const scrollY = window.scrollY;
                fetch("/scriptlet/schedule/list").then(async (r)=>{
                    console.debug("GET", "/scriptlet/schedule/list", r)
                    if(r.ok) {
                        const d = await r.json();
                        console.debug("schedules", d);
                        const tbody = $("#schedules");
                        const existingRows = {};
                        tbody.find("tr").each(function() {
                            const id = $(this).data("id");
                            if(id) existingRows[id] = this;
                        });
                        const newKeys = new Set();
                        for(const i of d) {
                            const key = i.id;
                            newKeys.add(key);
                            if(existingRows[key]) {
                                $(existingRows[key]).html(genScheduleRowContent(i));
                            } else {
                                const newRowHtml = genScheduleItem(i);
                                let inserted = false;
                                tbody.find("tr").each(function() {
                                    const existingKey = getRowKey(this);
                                    if (!inserted && key < existingKey) {
                                        $(this).before(newRowHtml);
                                        inserted = true;
                                        return false;
                                    }
                                });
                                if (!inserted) tbody.append(newRowHtml);
                            }
                        }
                        tbody.find("tr").each(function() {
                            const id = $(this).data("id");
                            if(id && !newKeys.has(id)) $(this).remove();
                        });
                        window.scrollTo(0, scrollY);
                    } else
                        console.error("GET", "/scriptlet/schedule/list", r.statusText);
                }).catch((e)=>console.error("GET", "/scriptlet/schedule/list", e.toString()));
            }

            function clearCreateModal() {
                $("#createModal-error").text("");
                $("#createModal-set").val("");
                $("#createModal-name").val("");
                $("#createModal-dropDone").prop( "checked", false);
                $("#createModal-maxRetries").val("0");
                $("#createModal-schedule").val("");
                $("#createModal-param").val("");
            }

            function onCreate() {
                console.debug("onCreate");

                const set = $("#createModal-set").val();
                const name = $("#createModal-name").val();
                const drop_done = $("#createModal-dropDone").is(':checked');
                const max_retries = parseInt($("#createModal-maxRetries").val()) || 0;
                const schedule = $("#createModal-schedule").val();
                const param = $("#createModal-param").val();

                const data = {
                    "set": set,
                    "name": name,
                    "drop_done": drop_done,
                    "max_retries": max_retries,
                    "schedule": schedule,
                    "param": param
                }

                console.debug("PUT", "/scriptlet/schedule/item", data);

                fetch("/scriptlet/schedule/item", {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                }).then(async (r)=>{
                    if(r.ok) {
                        $("#createModal").modal('hide');
                        clearCreateModal();
                        refreshList();
                    } else {
                        const d = await r.json();
                        $("#createModal-error").text(d.detail);
                    }
                }).catch((e)=>$("#createModal-error").text(e.toString()));
            }

            function del(id) {
                console.debug("del(${id})");

                if(window.confirm(`are you sure you want to delete ${id}`)) {
                    console.debug("DELETE", `/scriptlet/schedule/item?id=${id}`);

                    fetch(`/scriptlet/schedule/item?id=${id}`, {
                        method: "DELETE"
                    }).then(async (r)=>{
                        if(r.ok)
                            refreshList();
                        else
                            console.error("DELETE", `/scriptlet/schedule/item?id=${id}`, r.statusText);
                    }).catch((e)=>console.error("DELETE", `/scriptlet/schedule/item?id=${id}`, e.toString()));
                }
            }

            function run(id) {
                console.debug(`run(${id})`);
                
                fetch(`/scriptlet/schedule/run?id=${id}`).then(async (r)=>{
                    if(r.ok) {
                        const d = await r.json();
                        console.debug("run", d.job);

                        alert(`Executed as job '${d.job}'`)
                    } else
                        console.error(await r.text());
                }).catch((e)=>console.error(e.toString()));
            }

            function activate(id) {
                console.debug(`activate(${id})`);
                
                fetch(`/scriptlet/schedule/activate?id=${id}`).then(async (r)=>{
                    if(r.ok) {
                        const d = await r.json();
                        console.debug("activate", id);

                        refreshList();
                    } else
                        console.error(await r.text());
                }).catch((e)=>console.error(e.toString()));
            }

            function deactivate(id) {
                console.debug(`deactivate(${id})`);

                fetch(`/scriptlet/schedule/deactivate?id=${id}`).then(async (r)=>{
                    if(r.ok) {
                        const d = await r.json();
                        console.debug("deactivate", id);

                        refreshList();
                    } else
                        console.error(await r.text());
                }).catch((e)=>console.error(e.toString()));
            }

            function edit(id) {
                console.debug(`edit(${id})`);

                fetch(`/scriptlet/schedule/item?id=${id}`).then(async (r)=>{
                    if(r.ok) {
                        const s = await r.json();
                        console.debug("edit schedule", s);

                        $("#editModal-id").val(s.id);
                        $("#editModal-set").val(s.set);
                        $("#editModal-name").val(s.name);
                        $("#editModal-dropDone").prop("checked", s.drop_done);
                        $("#editModal-maxRetries").val(s.max_retries);
                        $("#editModal-schedule").val(s.schedule);
                        $("#editModal-param").val(s.param);

                        $("#editModal").modal('show');
                    } else
                        console.error(await r.text());
                }).catch((e)=>console.error(e.toString()));
            }

            function clearEditModal() {
                $("#editModal-error").text("");
                $("#editModal-id").val("");
                $("#editModal-set").val("");
                $("#editModal-name").val("");
                $("#editModal-dropDone").prop("checked", false);
                $("#editModal-maxRetries").val("0");
                $("#editModal-schedule").val("");
                $("#editModal-param").val("");
            }

            function onUpdate() {
                console.debug("onUpdate");

                const id = parseInt($("#editModal-id").val());
                const set = $("#editModal-set").val();
                const name = $("#editModal-name").val();
                const drop_done = $("#editModal-dropDone").is(':checked');
                const max_retries = parseInt($("#editModal-maxRetries").val()) || 0;
                const schedule = $("#editModal-schedule").val();
                const param = $("#editModal-param").val();

                const data = {
                    "id": id,
                    "set": set,
                    "name": name,
                    "drop_done": drop_done,
                    "max_retries": max_retries,
                    "schedule": schedule,
                    "param": param
                }

                console.debug("PUT", "/scriptlet/schedule/item", data);

                fetch("/scriptlet/schedule/item", {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                }).then(async (r)=>{
                    if(r.ok) {
                        $("#editModal").modal('hide');
                        clearEditModal();
                        refreshList();
                    } else {
                        const d = await r.json();
                        $("#editModal-error").text(d.detail);
                    }
                }).catch((e)=>$("#editModal-error").text(e.toString()));
            }

            $(document).ready(() => {
                refreshList();
                setInterval(function() {
                    refreshList();
                }, 10000);
            });
        </script>
    </head>
    <body class="bg-body">
        <nav class="navbar navbar-expand navbar-dark bg-dark pt-3 sticky-top" data-testid="scheduler-navbar">
            <ul class="navbar-nav w-100">
                <li class="navbar-brand">
                    <span class="material-icons-round">description</span>
                    <span>Scriptlet/Scheduler</span>
                </li>

                <li class="nav-item m-1">
                    <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#createModal" data-testid="scheduler-create">
                        <span class="material-icons-round">add</span>
                    </button>
                </li>

                <li class="nav-item mx-auto"></li>

                <li class="nav-item m-1">
                    <button type="button" class="btn btn-success" onclick="refreshList()" data-testid="scheduler-refresh">
                        <span class="material-icons-round">refresh</span>
                    </button>
                </li>
            </ul>
        </nav>

        <table class="table table-secondary" data-testid="scheduler-table">
            <thead>
              <tr>
                <th scope="col">ID</th>
                <th scope="col">Set</th>
                <th scope="col">Name</th>
                <th scope="col">Drops</th>
                <th scope="col">Retries</th>
                <th scope="col">Schedule</th>
                <th scope="col">Last</th>
                <th scope="col">Actions</th>
                <th style="display:none;"></th>
              </tr>
            </thead>
            <tbody id="schedules" data-testid="scheduler-schedules">
            </tbody>
        </table>

        <!-- DIALOGS -->
        <div class="modal fade" data-bs-backdrop="static" id="createModal" tabindex="-1" aria-labelledby="createModalLabel" aria-hidden="true" data-testid="scheduler-create-modal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="createModalLabel">Create Schedule</h5>
                        <!--<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>-->
                        <p id="createModal-error" class="text-danger" data-testid="scheduler-create-error"></p>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="createModal-set" class="col-form-label">Set:</label>
                            <input id="createModal-set" type="text" class="form-control" data-testid="scheduler-create-set">
                        </div>
                        <div class="mb-3">
                            <label for="createModal-name" class="col-form-label">Name:</label>
                            <input id="createModal-name" type="text" class="form-control" data-testid="scheduler-create-name">
                        </div>
                        <div class="mb-3">
                            <label class="form-check-label" for="createModal-dropDone">Drop logs/data if successful:</label>
                            <input id="createModal-dropDone" class="form-check-input" type="checkbox" value="" data-testid="scheduler-create-drop-done">
                        </div>
                        <div class="mb-3">
                            <label for="createModal-maxRetries" class="col-form-label">Max Retries:</label>
                            <input id="createModal-maxRetries" type="number" min="0" value="0" class="form-control" data-testid="scheduler-create-max-retries">
                        </div>
                        <div class="mb-3">
                            <label for="createModal-schedule" class="col-form-label">Schedule:</label>
                            <input id="createModal-schedule" type="text" class="form-control" data-testid="scheduler-create-schedule">
                        </div>
                        <div class="mb-3">
                            <label for="createModal-param" class="col-form-label">Param:</label>
                            <textarea id="createModal-param" cols="40" rows="5" class="form-control" data-testid="scheduler-create-param"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger" data-bs-dismiss="modal" data-testid="scheduler-create-cancel">Cancel</button>
                        <button type="button" class="btn btn-primary" onclick="onCreate()" data-bs-target="#createModal" data-testid="scheduler-create-submit">Create</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" data-bs-backdrop="static" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true" data-testid="scheduler-edit-modal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editModalLabel">Edit Schedule</h5>
                        <!--<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>-->
                        <p id="editModal-error" class="text-danger" data-testid="scheduler-edit-error"></p>
                    </div>
                    <div class="modal-body">
                        <input id="editModal-id" type="hidden">
                        <div class="mb-3">
                            <label for="editModal-set" class="col-form-label">Set:</label>
                            <input id="editModal-set" type="text" class="form-control" data-testid="scheduler-edit-set">
                        </div>
                        <div class="mb-3">
                            <label for="editModal-name" class="col-form-label">Name:</label>
                            <input id="editModal-name" type="text" class="form-control" data-testid="scheduler-edit-name">
                        </div>
                        <div class="mb-3">
                            <label class="form-check-label" for="editModal-dropDone">Drop logs/data if successful:</label>
                            <input id="editModal-dropDone" class="form-check-input" type="checkbox" value="" data-testid="scheduler-edit-drop-done">
                        </div>
                        <div class="mb-3">
                            <label for="editModal-maxRetries" class="col-form-label">Max Retries:</label>
                            <input id="editModal-maxRetries" type="number" min="0" value="0" class="form-control" data-testid="scheduler-edit-max-retries">
                        </div>
                        <div class="mb-3">
                            <label for="editModal-schedule" class="col-form-label">Schedule:</label>
                            <input id="editModal-schedule" type="text" class="form-control" data-testid="scheduler-edit-schedule">
                        </div>
                        <div class="mb-3">
                            <label for="editModal-param" class="col-form-label">Param:</label>
                            <textarea id="editModal-param" cols="40" rows="5" class="form-control" data-testid="scheduler-edit-param"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger" data-bs-dismiss="modal" data-testid="scheduler-edit-cancel">Cancel</button>
                        <button type="button" class="btn btn-primary" onclick="onUpdate()" data-bs-target="#editModal" data-testid="scheduler-edit-submit">Update</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
