<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

		<link rel="stylesheet" href="/files/css/bootstrap/bootstrap.min.css">
        <link rel="stylesheet" href="/files/css/material/material-icons.css">
        <style>
            .set-chevron { transition: transform 0.15s ease; }
            [data-bs-toggle="collapse"][aria-expanded="true"] .set-chevron { transform: rotate(90deg); }
            .set-card-header .badge { font-weight: normal; }

            /* Below the navbar-expand-md breakpoint the toolbar collapses;
               lay its icons out in a single horizontally-scrollable row
               instead of stacking them vertically. */
            @media (max-width: 767.98px) {
                .navbar-collapse .navbar-nav {
                    flex-direction: row;
                    flex-wrap: nowrap;
                    overflow-x: auto;
                }
            }
        </style>

        <script src="/files/js/jquery.min.js"></script>
        <script src="/files/js/js.cookie.min.js"></script>
        <script src="/files/js/bootstrap/bootstrap.bundle.min.js"></script>

        <script>
            const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
            function currentTableClass() {
                return mediaQuery.matches ? 'table-dark' : 'table-secondary';
            }
            function setTheme(e) {
                const body = document.body;
                const tables = document.querySelectorAll('table');
                if (e.matches) {
                    document.documentElement.setAttribute('data-bs-theme', 'dark');
                    body.classList.remove('bg-body');
                    body.classList.add('bg-dark');
                    tables.forEach((t) => { t.classList.remove('table-secondary'); t.classList.add('table-dark'); });
                } else {
                    document.documentElement.setAttribute('data-bs-theme', 'light');
                    body.classList.remove('bg-dark');
                    body.classList.add('bg-body');
                    tables.forEach((t) => { t.classList.remove('table-dark'); t.classList.add('table-secondary'); });
                }
            }
            mediaQuery.addEventListener('change', setTheme);
            $(document).ready(function() {
                setTheme(mediaQuery);
            });
        </script>

        <script type="text/javascript">
            'use strict';

            function genActions(j) {
                if(["cancel", "dequeued"].includes(j.state))
                    return genTransActions(j);
                else if(["cancelled", "killed", "failed", "done"].includes(j.state))
                    return genDoneActions(j);
                else
                    return genUndoneActions(j);
            }

            function genTransActions(j) {
                return `
                    <button type="button" onclick="copyParam('${j.id}')" class="btn btn-warning p-0" title="Copy this job's param to the clipboard" data-testid="job-copy-${j.id}">
                        <span class="material-icons-round">copy_all</span>
                    </button>
                `
            }

            function genUndoneActions(j) {
                return `
                    <button type="button" onclick="cancel('${j.id}')" class="btn btn-danger p-0" title="Cancel this running job" data-testid="job-cancel-${j.id}">
                        <span class="material-icons-round">cancel</span>
                    </button>
                    <button type="button" onclick="download('${j.id}')" class="btn btn-warning p-0" title="Download this job's logs + workspace" data-testid="job-download-${j.id}">
                        <span class="material-icons-round">download</span>
                    </button>
                    <button type="button" onclick="copyParam('${j.id}')" class="btn btn-danger p-0" title="Copy this job's param to the clipboard" data-testid="job-copy-${j.id}">
                        <span class="material-icons-round">copy_all</span>
                    </button>
                `
            }

            function genDoneActions(j) {
                return `
                    <button type="button" onclick="del('${j.id}')" class="btn btn-danger p-0" title="Delete this job and its workspace" data-testid="job-delete-${j.id}">
                        <span class="material-icons-round">delete</span>
                    </button>
                    <button type="button" onclick="download('${j.id}')" class="btn btn-warning p-0" title="Download this job's logs + workspace" data-testid="job-download-${j.id}">
                        <span class="material-icons-round">download</span>
                    </button>
                    <button type="button" onclick="copyParam('${j.id}')" class="btn btn-danger p-0" title="Copy this job's param to the clipboard" data-testid="job-copy-${j.id}">
                        <span class="material-icons-round">copy_all</span>
                    </button>
                `
            }

            function genJobRowContent(j) {
                return `
                    <th scope="row">${j.id}</th>
                    <td>${j.start}</td>
                    <td>${j.end}</td>
                    <td>${j.kind}</td>
                    <td>
                        <span class="d-inline-block" tabindex="0" data-toggle="tooltip" title='${j.detail ? j.detail.replace(/'/g, "&#39;") : ""}'>
                            ${j.state}
                        </span>
                    </td>
                    <td>${genActions(j)}</td>
                    <td id="param_${j.id}" style="display:none;">${j.param}</td>
                `;
            }

            function genJobItem(j) {
                return `<tr data-id="${j.id}" data-testid="job-row-${j.id}">${genJobRowContent(j)}</tr>`;
            }

            // One collapsible Bootstrap card per set, collapsed by default.
            // refreshList only creates a section that doesn't exist yet, so a
            // user's expand survives the 10s auto-refresh.
            function genSetSection(set) {
                const bodyId = `monitor-set-body-${set}`;
                return `
                    <div class="card mb-2" data-set="${set}" data-testid="monitor-set-${set}">
                        <div class="card-header set-card-header p-0">
                            <button class="btn btn-link text-reset text-decoration-none w-100 text-start d-flex align-items-center collapsed"
                                    type="button" data-bs-toggle="collapse" data-bs-target="#${bodyId}"
                                    aria-expanded="false" aria-controls="${bodyId}"
                                    title="Expand/collapse this set" data-testid="monitor-set-toggle-${set}">
                                <span class="material-icons-round set-chevron">chevron_right</span>
                                <span class="fw-bold ms-1">${set}</span>
                                <span class="badge bg-secondary ms-2" data-set-count>0</span>
                            </button>
                        </div>
                        <div id="${bodyId}" class="collapse">
                            <div class="table-responsive">
                                <table class="table ${currentTableClass()}" data-testid="monitor-table-${set}">
                                    <thead>
                                        <tr>
                                            <th scope="col">ID</th>
                                            <th scope="col">Start</th>
                                            <th scope="col">End</th>
                                            <th scope="col">Kind</th>
                                            <th scope="col">State</th>
                                            <th scope="col">Actions</th>
                                            <th style="display:none;"></th>
                                        </tr>
                                    </thead>
                                    <tbody data-set-body="${set}"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>`;
            }

            function ensureSetSection(set) {
                const container = $("#sets-container");
                let card = container.children(`[data-set="${set}"]`);
                if (card.length) return card;
                const html = genSetSection(set);
                let inserted = false;
                container.children("[data-set]").each(function() {
                    if (!inserted && set < $(this).attr("data-set")) {
                        $(this).before(html);
                        inserted = true;
                        return false;
                    }
                });
                if (!inserted) container.append(html);
                return container.children(`[data-set="${set}"]`);
            }

            function copyParam(id) {
                const param = $(`#param_${id}`).text();
                navigator.clipboard.writeText(param);
            }

            function refreshList() {
                const scrollY = window.scrollY;
                fetch("/scriptlet/job/list").then(async (r)=>{
                    console.debug("GET", "/scriptlet/job/list", r)
                    if(r.ok) {
                        const d = await r.json();
                        console.debug("jobs", d);

                        // Group jobs by set; within a set the row key is the
                        // job id. `/scriptlet/job/list` always returns `set`.
                        const bySet = {};
                        for(const i of d) (bySet[i.set] = bySet[i.set] || []).push(i);

                        for(const set of Object.keys(bySet)) {
                            const card = ensureSetSection(set);
                            const tbody = card.find("tbody");
                            const items = bySet[set];
                            const existingRows = {};
                            tbody.find("tr").each(function() {
                                const id = $(this).data("id");
                                if(id) existingRows[id] = this;
                            });
                            const newKeys = new Set();
                            for(const i of items) {
                                const key = i.id;
                                newKeys.add(key);
                                if(existingRows[key]) {
                                    $(existingRows[key]).html(genJobRowContent(i));
                                } else {
                                    const newRowHtml = genJobItem(i);
                                    let inserted = false;
                                    tbody.find("tr").each(function() {
                                        if (!inserted && key < $(this).data("id")) {
                                            $(this).before(newRowHtml);
                                            inserted = true;
                                            return false;
                                        }
                                    });
                                    if (!inserted) tbody.append(newRowHtml);
                                }
                            }
                            tbody.find("tr").each(function() {
                                const id = $(this).data("id");
                                if(id && !newKeys.has(id)) $(this).remove();
                            });
                            card.find("[data-set-count]").text(items.length);
                        }

                        // Drop sets that no longer have any jobs.
                        const liveSets = new Set(Object.keys(bySet));
                        $("#sets-container").children("[data-set]").each(function() {
                            if(!liveSets.has($(this).attr("data-set"))) $(this).remove();
                        });

                        window.scrollTo(0, scrollY);
                    } else
                        console.error("GET", "/scriptlet/job/list", r.statusText);
                }).catch((e)=>console.error("GET", "/scriptlet/job/list", e.toString()));
            }

            function enqueueRefreshList() {
                setTimeout(function() { refreshList(); }, 500);
            }

            function clearCreateModal() {
                $("#createModal-error").text("");
                $("#createModal-set").val("");
                $("#createModal-name").val("");
                $("#createModal-schedule").val("");
                $("#createModal-param").val("");
            }

            function onCreate() {
                console.debug("onCreate");

                const set = $("#createModal-set").val();
                const name = $("#createModal-name").val();
                const schedule = $("#createModal-schedule").val();
                const param = $("#createModal-param").val();

                const data = {
                    "set": set,
                    "name": name,
                    "schedule": schedule,
                    "param": param
                }

                console.debug("PUT", "/scriptlet/schedule/item", data);

                fetch("/scriptlet/schedule/item", {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                }).then(async (r)=>{
                    if(r.ok) {
                        $("#createModal").modal('hide');
                        clearCreateModal();
                        enqueueRefreshList();
                    } else {
                        const d = await r.json();
                        $("#createModal-error").text(d.detail);
                    }
                }).catch((e)=>$("#createModal-error").text(e.toString()));
            }

            function cancel(id, refresh = true) {
                console.debug(`cancel(${id}, ${refresh})`);

                console.debug("GET", `/scriptlet/job/cancel?id=${id}`);

                fetch(`/scriptlet/job/cancel?id=${id}`).then(async (r)=>{
                    if(r.ok) {
                        if(refresh)
                            enqueueRefreshList();
                    } else
                        console.error("GET", `/scriptlet/job/cancel?id=${id}`, r.statusText);
                }).catch((e)=>console.error("GET", `/scriptlet/job/cancel?id=${id}`, e.toString()));
            }

            function cancelAll() {
                console.debug(`cancelAll()`);

                fetch("/scriptlet/job/list").then(async (r)=>{
                    console.debug("GET", "/scriptlet/job/list", r)
                    if(r.ok) {
                        const d = await r.json();
                        console.debug("jobs", d);
                        for(const i of d)
                            if(!["cancelled", "killed", "failed", "done", "cancel", "dequeued"].includes(i.state))
                                cancel(i.id, i == d[d.length - 1]);
                    } else
                        console.error("GET", "/scriptlet/job/list", r.statusText);
                }).catch((e)=>console.error("GET", "/scriptlet/job/list", e.toString()));
            }

            async function del(id, refresh = true) {
                console.debug(`del(${id}, ${refresh})`);

                console.debug("DELETE", `/scriptlet/job/item?id=${id}`);

                try {
                    const r = await fetch(`/scriptlet/job/item?id=${id}`, {
                        method: "DELETE"
                    })
                    if(r.ok) {
                        if(refresh)
                            enqueueRefreshList();
                    } else
                        console.error("DELETE", `/scriptlet/job/item?id=${id}`, r.statusText);
                } catch(e) {
                    console.error("DELETE", `/scriptlet/job/item?id=${id}`, e.toString());
                }
            }

            async function delAllOf(state) {
                console.debug(`delAllOf(${state})`);

                try {
                    const r = await fetch("/scriptlet/job/list")
                    console.debug("GET", "/scriptlet/job/list", r)
                    if(r.ok) {
                        const d = await r.json();
                        console.debug("jobs", d);
                        for(const i of d)
                            if(state.includes(i.state))
                                await del(i.id, false);
                        
                        enqueueRefreshList();
                    } else
                        console.error("GET", "/scriptlet/job/list", r.statusText);
                } catch(e) {
                    console.error("GET", "/scriptlet/job/list", e.toString());
                }
            }

            function download(id) {
                console.debug(`download(${id})`);

                var ifrm = document.getElementById("download");
                ifrm.src = `/scriptlet/job/download?id=${id}`;
            }

            function view(id) {
                console.debug(`view(${id})`);

                window.open(`${window.location.origin}/scriptlet/view_job?id=${id}`,`PyOps - Scriptlet/View ${id}`,"titlebar=no,toolbar=no,menubar=no,scrollbars=no");
            }

            $(document).ready(() => {
                refreshList();
                setInterval(function() {
                    refreshList();
                }, 10000);
            });
        </script>
    </head>
    <body class="bg-body">
        <nav class="navbar navbar-expand-md navbar-dark bg-dark pt-3 sticky-top" data-testid="monitor-navbar">
            <div class="container-fluid">
                <span class="navbar-brand">
                    <span class="material-icons-round">description</span>
                    <span>Scriptlet/Monitor</span>
                </span>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#monitorNav" aria-controls="monitorNav" aria-expanded="false" title="Show/hide the toolbar" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="monitorNav">
                    <ul class="navbar-nav w-100">
                        <li class="nav-item m-1">
                            <button type="button" class="btn btn-danger" onclick="cancelAll()" title="Cancel every in-flight job" data-testid="monitor-cancel-all">
                                <span class="material-icons-round">cancel</span>
                            </button>
                        </li>

                        <li class="nav-item m-1">
                            <button type="button" class="btn btn-danger" onclick="delAllOf(['done', 'cancelled'])" title="Delete all done/cancelled jobs" data-testid="monitor-delete-done">
                                <span class="material-icons-round">delete</span>
                            </button>
                        </li>

                        <li class="nav-item m-1">
                            <button type="button" class="btn btn-danger" onclick="delAllOf(['failed', 'killed'])" title="Delete all failed/killed jobs" data-testid="monitor-delete-failed">
                                <span class="material-icons-round">delete_forever</span>
                            </button>
                        </li>

                        <li class="nav-item mx-auto"></li>

                        <li class="nav-item m-1">
                            <button type="button" class="btn btn-success" onclick="refreshList()" title="Reload the job list" data-testid="monitor-refresh">
                                <span class="material-icons-round">refresh</span>
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container-fluid mt-2" id="sets-container" data-testid="monitor-sets">
        </div>
        <iframe id="download" style="display:none"></iframe>
    </body>
</html>
