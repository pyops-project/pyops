<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

		<link rel="stylesheet" href="/files/css/bootstrap/bootstrap.min.css">
        <link rel="stylesheet" href="/files/css/material/material-icons.css">
		<link rel="stylesheet" href="/files/css/ace/ace.css">

        <script src="/files/js/jquery.min.js"></script>
        <script src="/files/js/js.cookie.min.js"></script>
        <script src="/files/js/bootstrap/bootstrap.bundle.min.js"></script>
        <script src="/files/js/ace/ace.js"></script>
        <script src="/files/js/ace/mode-python.js"></script>
        <script src="/files/js/ace/ext-linking.js"></script>
        <script src="/files/js/ace/ext-language_tools.js"></script>


        <script>
            'use strict';

            const urlParams = new URLSearchParams(window.location.search);
            const set = urlParams.get("set");
            const name = urlParams.get("name");

            var param = null;
            var editor = null;
            var langTools = ace.require('ace/ext/language_tools');
            var out = null;
            var errout = null;
            var draftLock = false;
            var editor_dirty = false;

            var pylintCompleter = {
                getCompletions: function(editor, session, pos, prefix, callback) {
                    const data = {
                        "code": editor.getValue(),
                        "line": editor.getCursorPosition().row + 1,
                        "column": editor.getCursorPosition().column
                    };

                    fetch("/scriptlet/completion", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(data)
                    }).then(async (r)=>{
                        if(r.ok) {
                            const d = await r.json();
                            callback(null, d);
                        } else
                            console.error(r.statusText);
                    }).catch((e)=>console.error("completion", e.toString()));
                }
            }
            langTools.setCompleters([]);
            langTools.addCompleter(pylintCompleter);

            var job_id = null;

            function log(o, e) {
                const out_at_bottom = !out.renderer.isScrollableBy(0, 3*out.renderer.lineHeight);
                const errout_at_bottom = !errout.renderer.isScrollableBy(0, 3*errout.renderer.lineHeight);
                const out_old_val = out.getValue();
                const errout_old_val = errout.getValue();
                const out_old_last_line = out.session.doc.getAllLines().length;
                const errout_old_last_line = errout.session.doc.getAllLines().length;
                if(o) {
                    if(!out_old_val) {
                        out.setValue(o);
                        out.moveCursorTo(0,0);
                    } else {
                        const rng = new ace.Range(out_old_last_line+1, 0, out_old_last_line+1, 0);
                        out.session.doc.replace(rng, o.substring(out_old_val.length, o.length));
                    }
                }
                
                if(e) {
                    if(!errout_old_val) {
                        errout.setValue(e);
                        errout.moveCursorTo(0,0);
                    } else {
                        const rng = new ace.Range(errout_old_last_line+1, 0, errout_old_last_line+1, 0);
                        errout.session.doc.replace(rng, e.substring(errout_old_val.length, e.length));
                    }
                }

                if(out_at_bottom)
                    out.scrollToLine(Number.POSITIVE_INFINITY)
                if(errout_at_bottom)
                    errout.scrollToLine(Number.POSITIVE_INFINITY)
                
                // hack because of editor render problem on writing out
                setTimeout(function() { param.resize(); editor.resize(); out.resize(); errout.resize(); }, 500);
            }
            
            function clearLogs() {
                out.setValue('');
                errout.setValue('');
                console.debug('Logs cleared');
                // hack because of editor render problem on writing out
                setTimeout(function() { param.resize(); editor.resize(); out.resize(); errout.resize(); }, 500);
            }

            function refresh() {
                console.debug("refresh");
                
                draftLock = true;
                fetch(`/scriptlet/inventory/code?set=${set}&name=${name}`).then(async (r)=>{
                    if(r.ok) {
                        const d = await r.json();
                        editor.setValue(d.code);
                        editor.moveCursorTo(0,0);
                        draftLock = false;
                    } else
                        console.error("refresh", r.statusText);
                }).catch((e)=>console.error(e.toString()));
            }

            async function poll() {
                console.debug(`poll()`)
                fetch(`/scriptlet/job/item?id=${job_id}`).then(async (r)=>{
                    if(r.ok) {
                        const d = await r.json();
                        console.debug("pull", d);

                        if(["todo", "dequeued", "loading", "running", "cancel"].includes(d.state)) {
                            if(d.stdout)
                                log(d.stdout.trim(), d.stderr ? d.stderr.trim() : "");
                            else
                                log("", d.stderr ? d.stderr.trim() : "")
                            setTimeout(function() { poll(); }, 500);
                        } else {
                            $("#btn_cancel").attr("disabled", "disabled");
                            $("#btn_run").removeAttr("disabled");
                            $("#btn_test").removeAttr("disabled");

                            console.debug("poll", d.state);
                            if(d.state == "done")
                                log(d.stdout ? d.stdout.trim()+"\n" : d.state, d.stderr ? d.stderr.trim()+"\n" : "");
                            else
                                log((d.stdout ? d.stdout+"\n" : "")+d.state, d.stderr ? d.stderr.trim()+"\n" : "");
                            job_id = null;
                        }
                    } else
                        console.error("poll", r.statusText);
                }).catch((err)=>console.error(err));
            }

            function cancel() {
                console.debug(`cancel()`)
                $("#btn_cancel").attr("disabled", "disabled")
                $("#btn_run").removeAttr("disabled")
                $("#btn_test").removeAttr("disabled")
                fetch(`/scriptlet/job/cancel?id=${job_id}`);
                console.debug("cancel", job_id);
            }

            function _enqueueWithKind(kind, label) {
                out.setValue(""); errout.setValue("");
                out.scrollToLine(Number.POSITIVE_INFINITY)
                errout.scrollToLine(Number.POSITIVE_INFINITY)

                save();

                const data = {
                    "set": set,
                    "name": name,
                    "drop_done": false,
                    "param": param.getValue(),
                    "kind": kind
                };

                fetch(`/scriptlet/job/item`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                }).then(async (r)=>{
                    if(r.ok) {
                        const d = await r.json();
                        console.debug(label, d.job);

                        job_id = d.job
                        $("#btn_run").attr("disabled", "disabled")
                        $("#btn_test").attr("disabled", "disabled")
                        $("#btn_cancel").removeAttr("disabled")

                        poll();
                    } else
                        console.error(await r.text());
                }).catch((e)=>console.error(e.toString()));
            }

            function run() {
                console.debug(`run()`);
                _enqueueWithKind("draft", "run");
            }

            function runAsTest() {
                console.debug(`runAsTest()`);
                _enqueueWithKind("test", "test");
            }

            function fontSizeChanged() {
                param.setOptions({
                    fontSize: $("#font-size").val()
                });
                editor.setOptions({
                    fontSize: $("#font-size").val()
                });
                out.setOptions({
                    fontSize: $("#font-size").val()
                });
                errout.setOptions({
                    fontSize: $("#font-size").val()
                });
            }

            function save() {
                if(!draftLock) {
                    const data = {
                        "set": set,
                        "name": name,
                        "code": editor.getValue()
                    };
                    fetch("/scriptlet/inventory/draft", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(data)
                    }).then(async (r)=>{
                        if(r.ok)
                            console.debug("save", "Draft Stored");
                        else
                            console.error(r.statusText);
                    }).catch((e)=>console.error("save", e.toString()));
                }
            }

            function save_draft() {
                if(editor_dirty) {
                    save();
                    editor_dirty = false;
                    $("#btn-revert").prop("disabled", false);
                }
                setTimeout(function() { save_draft(); }, 1000);
            }

            function rollback() {
                fetch(`/scriptlet/inventory/draft?name=${name}&set=${set}`, {
                    method: "DELETE"
                }).then(async (r)=>{
                    if(r.ok) {
                        console.debug("rollback", "to last revision");
                        refresh();
                    } else
                        console.error(r.statusText);
                }).catch((e)=>console.error(e.toString()));
            }

            $(document).ready(() =>{
                $("#scriptlet-id").text(`${set}::${name}`);

                param = ace.edit("param", {
                    mode: "ace/mode/python",
                    theme: "ace/theme/twilight",
                    minLines: 0,
                    maxLines: 10,
                    showPrintMargin: false,
                    enableLinking: true,
                    selectionStyle: "text",
                    fontSize: $("#font-size").val(),
                    useWorker: false
                });

                editor = ace.edit("editor", {
                    mode: "ace/mode/python",
                    theme: "ace/theme/twilight",
                    showPrintMargin: false,
                    enableLinking: true,
                    enableBasicAutocompletion: true,
                    enableLiveAutocompletion: true,
                    enableSnippets: true,
                    selectionStyle: "text",
                    fontSize: $("#font-size").val(),
                    useWorker: false
                });

                out = ace.edit("out", {
                    theme: "ace/theme/twilight",
                    minLines: 0,
                    maxLines: 20,
                    readOnly: true,
                    highlightActiveLine: false,
                    highlightGutterLine: false,
                    showPrintMargin: false,
                    enableLinking: true,
                    selectionStyle: "text",
                    fontSize: $("#font-size").val(),
                    useWorker: false
                });

                errout = ace.edit("errout", {
                    theme: "ace/theme/twilight",
                    minLines: 0,
                    maxLines: 20,
                    readOnly: true,
                    highlightActiveLine: false,
                    highlightGutterLine: false,
                    showPrintMargin: false,
                    enableLinking: true,
                    selectionStyle: "text",
                    fontSize: $("#font-size").val(),
                    useWorker: false
                });

                editor.on("change", ()=>{
                    editor_dirty = true;
                    $("#btn-revert").prop("disabled", false);
                });

                document.addEventListener('keydown', function(e) {
                    if(e.ctrlKey && e.key === 's') {
                        e.preventDefault();
                        save();
                    }
                });

                save_draft();
                refresh();
                setTimeout(checkStatus, 1000);
            });

            async function checkStatus() {
                try {
                    const resp = await fetch(`/scriptlet/inventory/status?set=${set}&name=${name}`);
                    if (resp.ok) {
                        const d = await resp.json();
                        console.log(`Status for ${set}::${name}:`, d.has_unstaged);
                        const has = d.has_unstaged;
                        $("#btn-revert").prop("disabled", !has);
                    } else {
                        $("#btn-revert").prop("disabled", true);
                        console.error("Status fetch failed", resp.statusText);
                    }
                } catch (e) {
                    console.error("Status check error", e.toString());
                    $("#btn-revert").prop("disabled", true);
                }
            }
        </script>
    </head>
    <body class="d-flex flex-column bg-dark h-100">
        <nav class="d-flex flex-column navbar navbar-expand navbar-dark bg-dark align-items-stretch" data-testid="editor-task-navbar">
            <ul class="navbar-nav">
                <li class="navbar-brand m-1">
                    <span class="material-icons-round">description</span>
                    <span>Task Editor</span>
                    <span id="scriptlet-id" data-testid="editor-scriptlet-id"></span>
                </li>
                <li class="nav-item m-1">
                    <button id="btn-revert" type="button" class="btn btn-danger" onclick="rollback()" disabled="disabled" data-testid="editor-revert">
                        <span class="material-icons-round">backspace</span>
                    </button>
                </li>
                <li class="nav-item m-1">
                    <button id="btn_run" type="button" class="btn btn-success" onclick="run()" title="Run draft (kind=draft)" data-testid="editor-run">
                        <span class="material-icons-round">play_arrow</span>
                    </button>
                </li>
                <li class="nav-item m-1">
                    <button id="btn_test" type="button" class="btn btn-info" onclick="runAsTest()" title="Run as test (kind=test)" data-testid="editor-test">
                        <span class="material-icons-round">science</span>
                    </button>
                </li>
                <li class="nav-item m-1">
                    <button id="btn_cancel" type="button" class="btn btn-danger" onclick="cancel()" disabled="disabled" data-testid="editor-cancel">
                        <span class="material-icons-round">cancel</span>
                    </button>
                </li>
                <li class="nav-item m-1">
                    <button type="button" class="btn btn-warning" onclick="clearLogs();" data-testid="editor-clear-logs">
                        <span class="material-icons-round">cleaning_services</span>
                    </button>
                </li>
                <li class="nav-item m-1">
                    <select id="font-size" class="form-select bg-dark text-light" onchange="fontSizeChanged()" data-testid="editor-font-size">
                        <option value="8pt">8pt</option>
                        <option value="9pt" selected>9pt</option>
                        <option value="12pt">12pt</option>
                        <option value="13pt">13pt</option>
                    </select>
                </li>
            </ul>
        </nav>

        <div id="param" class="d-flex flex-column border border-primary border" data-testid="editor-param"></div>

        <div id="editor" class="d-flex flex-column flex-grow-1 mt-1" data-testid="editor-code"></div>

        <div id="out" class="d-flex flex-column text-light border border-secondary border mt-1" data-testid="editor-stdout"></div>

        <div id="errout" class="d-flex flex-column text-danger border border-danger border mt-1" data-testid="editor-stderr"></div>
    </body>
</html>
