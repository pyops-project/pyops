<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

		<link rel="stylesheet" href="/files/css/bootstrap/bootstrap.min.css">
        <link rel="stylesheet" href="/files/css/material/material-icons.css">
		<link rel="stylesheet" href="/files/css/ace/ace.css">
        <style>
            .pane-chevron { transition: transform 0.15s ease; }
            [data-bs-toggle="collapse"][aria-expanded="true"] .pane-chevron { transform: rotate(90deg); }
            /* Output panes: fixed default height (set to ~10 lines in JS),
               user-resizable by dragging the bottom edge. Ace fills the box. */
            .output-pane { resize: vertical; overflow: hidden; min-height: 4em; height: 12em; }
            .output-pane > div { width: 100%; height: 100%; }
        </style>

        <script src="/files/js/jquery.min.js"></script>
        <script src="/files/js/js.cookie.min.js"></script>
        <script src="/files/js/bootstrap/bootstrap.bundle.min.js"></script>
        <script src="/files/js/pyops-alert.js"></script>
        <script src="/files/js/ace/ace.js"></script>
        <script src="/files/js/ace/mode-python.js"></script>
        <script src="/files/js/ace/ext-linking.js"></script>
        <script src="/files/js/ace/ext-language_tools.js"></script>


        <script>
            'use strict';

            const urlParams = new URLSearchParams(window.location.search);
            const set = urlParams.get("set");
            const name = urlParams.get("name");

            var param = null;
            var editor = null;
            var langTools = ace.require('ace/ext/language_tools');
            var out = null;
            var errout = null;
            var draftLock = false;
            var editor_dirty = false;

            var pylintCompleter = {
                getCompletions: function(editor, session, pos, prefix, callback) {
                    const data = {
                        "code": editor.getValue(),
                        "line": editor.getCursorPosition().row + 1,
                        "column": editor.getCursorPosition().column
                    };

                    fetch("/scriptlet/completion", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(data)
                    }).then(async (r)=>{
                        if(r.ok) {
                            pyopsAlert.loaded("Completion");
                            const d = await r.json();
                            callback(null, d);
                        } else
                            await pyopsAlert.loadFailed("Completion", r);
                    }).catch((e)=>pyopsAlert.loadError("Completion", e));
                }
            }
            langTools.setCompleters([]);
            langTools.addCompleter(pylintCompleter);

            var job_id = null;

            function log(o, e) {
                const out_at_bottom = !out.renderer.isScrollableBy(0, 3*out.renderer.lineHeight);
                const errout_at_bottom = !errout.renderer.isScrollableBy(0, 3*errout.renderer.lineHeight);
                const out_old_val = out.getValue();
                const errout_old_val = errout.getValue();
                const out_old_last_line = out.session.doc.getAllLines().length;
                const errout_old_last_line = errout.session.doc.getAllLines().length;
                if(o) {
                    if(!out_old_val) {
                        out.setValue(o);
                        out.moveCursorTo(0,0);
                    } else {
                        const rng = new ace.Range(out_old_last_line+1, 0, out_old_last_line+1, 0);
                        out.session.doc.replace(rng, o.substring(out_old_val.length, o.length));
                    }
                }
                
                if(e) {
                    if(!errout_old_val) {
                        errout.setValue(e);
                        errout.moveCursorTo(0,0);
                    } else {
                        const rng = new ace.Range(errout_old_last_line+1, 0, errout_old_last_line+1, 0);
                        errout.session.doc.replace(rng, e.substring(errout_old_val.length, e.length));
                    }
                }

                if(out_at_bottom)
                    out.scrollToLine(Number.POSITIVE_INFINITY)
                if(errout_at_bottom)
                    errout.scrollToLine(Number.POSITIVE_INFINITY)
                
                // hack because of editor render problem on writing out
                setTimeout(function() { param.resize(); editor.resize(); out.resize(); errout.resize(); }, 500);
            }
            
            function clearLogs() {
                out.setValue('');
                errout.setValue('');
                console.debug('Logs cleared');
                // hack because of editor render problem on writing out
                setTimeout(function() { param.resize(); editor.resize(); out.resize(); errout.resize(); }, 500);
            }

            function refresh() {
                console.debug("refresh");
                
                draftLock = true;
                fetch(`/scriptlet/inventory/code?set=${set}&name=${name}`).then(async (r)=>{
                    if(r.ok) {
                        pyopsAlert.loaded("Code");
                        const d = await r.json();
                        editor.setValue(d.code);
                        editor.moveCursorTo(0,0);
                        draftLock = false;
                    } else
                        await pyopsAlert.loadFailed("Code", r);
                }).catch((e)=>pyopsAlert.loadError("Code", e));
            }

            async function poll() {
                console.debug(`poll()`)
                fetch(`/scriptlet/job/item?id=${job_id}`).then(async (r)=>{
                    if(r.ok) {
                        pyopsAlert.loaded("Job output");
                        const d = await r.json();
                        console.debug("pull", d);

                        if(["todo", "dequeued", "loading", "running", "cancel"].includes(d.state)) {
                            if(d.stdout)
                                log(d.stdout.trim(), d.stderr ? d.stderr.trim() : "");
                            else
                                log("", d.stderr ? d.stderr.trim() : "")
                            setTimeout(function() { poll(); }, 500);
                        } else {
                            $("#btn_cancel").attr("disabled", "disabled");
                            $("#btn_run").removeAttr("disabled");
                            $("#btn_test").removeAttr("disabled");

                            console.debug("poll", d.state);
                            if(d.state == "done")
                                log(d.stdout ? d.stdout.trim()+"\n" : d.state, d.stderr ? d.stderr.trim()+"\n" : "");
                            else
                                log((d.stdout ? d.stdout+"\n" : "")+d.state, d.stderr ? d.stderr.trim()+"\n" : "");
                            job_id = null;
                        }
                    } else
                        await pyopsAlert.loadFailed("Job output", r);
                }).catch((e)=>pyopsAlert.loadError("Job output", e));
            }

            function cancel() {
                console.debug(`cancel()`)
                $("#btn_cancel").attr("disabled", "disabled")
                $("#btn_run").removeAttr("disabled")
                $("#btn_test").removeAttr("disabled")
                // 409: the job finished meanwhile — nothing to cancel.
                fetch(`/scriptlet/job/cancel?id=${job_id}`).then(async (r)=>{
                    if(!r.ok && r.status !== 409)
                        await pyopsAlert.failed(`Cancel ${job_id}`, r);
                }).catch((e)=>pyopsAlert.error(`Cancel ${job_id}`, e));
                console.debug("cancel", job_id);
            }

            function _enqueueWithKind(kind, label) {
                expandOutputPanes();
                out.setValue(""); errout.setValue("");
                out.scrollToLine(Number.POSITIVE_INFINITY)
                errout.scrollToLine(Number.POSITIVE_INFINITY)

                save();

                const data = {
                    "set": set,
                    "name": name,
                    "drop_done": false,
                    "param": param.getValue(),
                    "kind": kind
                };

                fetch(`/scriptlet/job/item`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                }).then(async (r)=>{
                    if(r.ok) {
                        const d = await r.json();
                        console.debug(label, d.job);

                        job_id = d.job
                        $("#btn_run").attr("disabled", "disabled")
                        $("#btn_test").attr("disabled", "disabled")
                        $("#btn_cancel").removeAttr("disabled")

                        poll();
                    } else
                        await pyopsAlert.failed(`Run ${kind} ${set}::${name}`, r);
                }).catch((e)=>pyopsAlert.error(`Run ${kind} ${set}::${name}`, e));
            }

            function run() {
                console.debug(`run()`);
                _enqueueWithKind("draft", "run");
            }

            function runAsTest() {
                console.debug(`runAsTest()`);
                _enqueueWithKind("test", "test");
            }

            function fontSizeChanged() {
                param.setOptions({
                    fontSize: $("#font-size").val()
                });
                editor.setOptions({
                    fontSize: $("#font-size").val()
                });
                out.setOptions({
                    fontSize: $("#font-size").val()
                });
                errout.setOptions({
                    fontSize: $("#font-size").val()
                });
            }

            function save() {
                if(!draftLock) {
                    const data = {
                        "set": set,
                        "name": name,
                        "code": editor.getValue()
                    };
                    fetch("/scriptlet/inventory/draft", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(data)
                    }).then(async (r)=>{
                        if(r.ok)
                            console.debug("save", "Draft Stored");
                        else
                            await pyopsAlert.failed(`Save draft ${set}::${name}`, r);
                    }).catch((e)=>pyopsAlert.error(`Save draft ${set}::${name}`, e));
                }
            }

            function save_draft() {
                if(editor_dirty) {
                    save();
                    editor_dirty = false;
                    $("#btn-revert").prop("disabled", false);
                }
                setTimeout(function() { save_draft(); }, 1000);
            }

            function rollback() {
                fetch(`/scriptlet/inventory/draft?name=${name}&set=${set}`, {
                    method: "DELETE"
                }).then(async (r)=>{
                    if(r.ok) {
                        console.debug("rollback", "to last revision");
                        refresh();
                    } else
                        await pyopsAlert.failed(`Revert ${set}::${name}`, r);
                }).catch((e)=>pyopsAlert.error(`Revert ${set}::${name}`, e));
            }

            // Output panes (#out / #errout) live in collapsible sections,
            // collapsed by default. The pane container is user-resizable; its
            // height defaults to ~10 lines (computed once the pane is first
            // visible, since Ace can't measure lineHeight while hidden) and is
            // persisted per pane in localStorage.
            function setupOutputPane(editor, id, storageKey) {
                const paneEl = document.getElementById(id).parentElement;
                const saved = localStorage.getItem(storageKey);
                if(saved) paneEl.style.height = saved;
                const ro = new ResizeObserver(() => {
                    editor.resize();
                    if(paneEl.offsetHeight > 0 && paneEl.style.height)
                        localStorage.setItem(storageKey, paneEl.style.height);
                });
                ro.observe(paneEl);
                const body = document.getElementById(id + "-body");
                if(body) body.addEventListener("shown.bs.collapse", () => {
                    if(!paneEl.style.height)
                        paneEl.style.height = (Math.round(editor.renderer.lineHeight * 10) + 8) + "px";
                    editor.resize();
                });
            }

            function expandOutputPanes() {
                bootstrap.Collapse.getOrCreateInstance(document.getElementById("out-body")).show();
                bootstrap.Collapse.getOrCreateInstance(document.getElementById("errout-body")).show();
            }

            $(document).ready(() =>{
                $("#scriptlet-id").text(`${set}::${name}`);

                param = ace.edit("param", {
                    mode: "ace/mode/python",
                    theme: "ace/theme/twilight",
                    minLines: 0,
                    maxLines: 10,
                    showPrintMargin: false,
                    enableLinking: true,
                    selectionStyle: "text",
                    fontSize: $("#font-size").val(),
                    useWorker: false
                });

                editor = ace.edit("editor", {
                    mode: "ace/mode/python",
                    theme: "ace/theme/twilight",
                    showPrintMargin: false,
                    enableLinking: true,
                    enableBasicAutocompletion: true,
                    enableLiveAutocompletion: true,
                    enableSnippets: true,
                    selectionStyle: "text",
                    fontSize: $("#font-size").val(),
                    useWorker: false
                });

                // No min/maxLines: out/errout fill their resizable pane
                // container (height controlled by .output-pane, default ~10
                // lines, set below).
                out = ace.edit("out", {
                    theme: "ace/theme/twilight",
                    readOnly: true,
                    highlightActiveLine: false,
                    highlightGutterLine: false,
                    showPrintMargin: false,
                    enableLinking: true,
                    selectionStyle: "text",
                    fontSize: $("#font-size").val(),
                    useWorker: false
                });

                errout = ace.edit("errout", {
                    theme: "ace/theme/twilight",
                    readOnly: true,
                    highlightActiveLine: false,
                    highlightGutterLine: false,
                    showPrintMargin: false,
                    enableLinking: true,
                    selectionStyle: "text",
                    fontSize: $("#font-size").val(),
                    useWorker: false
                });

                setupOutputPane(out, "out", "pyops.editor.outHeight");
                setupOutputPane(errout, "errout", "pyops.editor.erroutHeight");

                editor.on("change", ()=>{
                    editor_dirty = true;
                    $("#btn-revert").prop("disabled", false);
                });

                document.addEventListener('keydown', function(e) {
                    if(e.ctrlKey && e.key === 's') {
                        e.preventDefault();
                        save();
                    }
                });

                save_draft();
                refresh();
                setTimeout(checkStatus, 1000);
            });

            async function checkStatus() {
                try {
                    const resp = await fetch(`/scriptlet/inventory/status?set=${set}&name=${name}`);
                    if (resp.ok) {
                        pyopsAlert.loaded("Draft status");
                        const d = await resp.json();
                        console.log(`Status for ${set}::${name}:`, d.has_unstaged);
                        const has = d.has_unstaged;
                        $("#btn-revert").prop("disabled", !has);
                    } else {
                        $("#btn-revert").prop("disabled", true);
                        await pyopsAlert.loadFailed("Draft status", resp);
                    }
                } catch (e) {
                    pyopsAlert.loadError("Draft status", e);
                    $("#btn-revert").prop("disabled", true);
                }
            }
        </script>
    </head>
    <body class="d-flex flex-column bg-dark h-100">
        <nav class="d-flex flex-column navbar navbar-expand navbar-dark bg-dark align-items-stretch" data-testid="editor-task-navbar">
            <ul class="navbar-nav">
                <li class="navbar-brand m-1">
                    <span class="material-icons-round">description</span>
                    <span>Task Editor</span>
                    <span id="scriptlet-id" data-testid="editor-scriptlet-id"></span>
                </li>
                <li class="nav-item m-1">
                    <button id="btn-revert" type="button" class="btn btn-danger" onclick="rollback()" disabled="disabled" title="Revert to the last committed revision (discards the current draft)" data-testid="editor-revert">
                        <span class="material-icons-round">backspace</span>
                    </button>
                </li>
                <li class="nav-item m-1">
                    <button id="btn_run" type="button" class="btn btn-success" onclick="run()" title="Save and run the current draft (kind=draft); output appears in the panes below" data-testid="editor-run">
                        <span class="material-icons-round">play_arrow</span>
                    </button>
                </li>
                <li class="nav-item m-1">
                    <button id="btn_test" type="button" class="btn btn-info" onclick="runAsTest()" title="Save and run the draft as a test (kind=test); __name__ is set to __test__" data-testid="editor-test">
                        <span class="material-icons-round">science</span>
                    </button>
                </li>
                <li class="nav-item m-1">
                    <button id="btn_cancel" type="button" class="btn btn-danger" onclick="cancel()" disabled="disabled" title="Cancel the currently running job" data-testid="editor-cancel">
                        <span class="material-icons-round">cancel</span>
                    </button>
                </li>
                <li class="nav-item m-1">
                    <button type="button" class="btn btn-warning" onclick="clearLogs();" title="Clear the stdout and stderr panes" data-testid="editor-clear-logs">
                        <span class="material-icons-round">cleaning_services</span>
                    </button>
                </li>
                <li class="nav-item m-1">
                    <select id="font-size" class="form-select bg-dark text-light" onchange="fontSizeChanged()" title="Editor font size for all panes" data-testid="editor-font-size">
                        <option value="8pt">8pt</option>
                        <option value="9pt" selected>9pt</option>
                        <option value="12pt">12pt</option>
                        <option value="13pt">13pt</option>
                    </select>
                </li>
                <li class="nav-item m-1 align-self-center">
                    <span id="pyops-load-status" class="navbar-text text-warning" data-testid="pyops-load-status" hidden></span>
                </li>
            </ul>
        </nav>

        <div id="param" class="d-flex flex-column border border-primary border" data-testid="editor-param"></div>

        <div id="editor" class="d-flex flex-column flex-grow-1 mt-1" data-testid="editor-code"></div>

        <div class="mt-1">
            <button id="out-toggle" type="button" class="btn btn-sm btn-dark text-light w-100 text-start d-flex align-items-center collapsed" data-bs-toggle="collapse" data-bs-target="#out-body" aria-expanded="false" aria-controls="out-body" title="Show/hide the standard-output pane — opens automatically when you Run" data-testid="editor-stdout-toggle">
                <span class="material-icons-round pane-chevron">chevron_right</span>
                <span class="ms-1">stdout</span>
            </button>
            <div id="out-body" class="collapse">
                <div class="output-pane border border-secondary" data-testid="editor-stdout-pane">
                    <div id="out" class="text-light" data-testid="editor-stdout"></div>
                </div>
            </div>
        </div>

        <div class="mt-1">
            <button id="errout-toggle" type="button" class="btn btn-sm btn-dark text-danger w-100 text-start d-flex align-items-center collapsed" data-bs-toggle="collapse" data-bs-target="#errout-body" aria-expanded="false" aria-controls="errout-body" title="Show/hide the standard-error pane — opens automatically when you Run" data-testid="editor-stderr-toggle">
                <span class="material-icons-round pane-chevron">chevron_right</span>
                <span class="ms-1">stderr</span>
            </button>
            <div id="errout-body" class="collapse">
                <div class="output-pane border border-danger" data-testid="editor-stderr-pane">
                    <div id="errout" class="text-danger" data-testid="editor-stderr"></div>
                </div>
            </div>
        </div>
    </body>
</html>
