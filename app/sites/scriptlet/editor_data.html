<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

        <link rel="stylesheet" href="/files/css/bootstrap/bootstrap.min.css">
        <link rel="stylesheet" href="/files/css/material/material-icons.css">
        <link rel="stylesheet" href="/files/css/ace/ace.css">

        <script src="/files/js/jquery.min.js"></script>
        <script src="/files/js/js.cookie.min.js"></script>
        <script src="/files/js/bootstrap/bootstrap.bundle.min.js"></script>
        <script src="/files/js/ace/ace.js"></script>
        <script src="/files/js/ace/mode-yaml.js"></script>
        <script src="/files/js/ace/mode-json.js"></script>
        <script src="/files/js/ace/ext-linking.js"></script>
        <script src="/files/js/ace/ext-language_tools.js"></script>


        <script>
            'use strict';

            const urlParams = new URLSearchParams(window.location.search);
            const set = urlParams.get("set");
            const name = urlParams.get("name");

            var editor = null;
            var langTools = ace.require('ace/ext/language_tools');
            var draftLock = false;
            var editor_dirty = false;
            var current_ext = null;

            function _aceMode(ext) {
                // YAML on disk uses the yaml Ace mode; .json uses the json mode.
                // .yml is a YAML alias.
                if (ext === 'json') return 'ace/mode/json';
                return 'ace/mode/yaml';
            }

            function refresh() {
                console.debug("refresh");

                draftLock = true;
                fetch(`/scriptlet/inventory/code?set=${set}&name=${name}`).then(async (r)=>{
                    if(r.ok) {
                        const d = await r.json();
                        // Switch the Ace mode if the file's extension differs
                        // from what we currently have (e.g. on first load, or
                        // if the file was reformatted server-side).
                        if (d.ext && d.ext !== current_ext) {
                            current_ext = d.ext;
                            editor.session.setMode(_aceMode(d.ext));
                            $("#data-ext").text(`.${d.ext}`);
                        }
                        editor.setValue(d.code);
                        editor.moveCursorTo(0,0);
                        draftLock = false;
                    } else
                        console.error("refresh", r.statusText);
                }).catch((e)=>console.error(e.toString()));
            }

            function fontSizeChanged() {
                editor.setOptions({
                    fontSize: $("#font-size").val()
                });
            }

            function save() {
                if(!draftLock) {
                    const data = {
                        "set": set,
                        "name": name,
                        "code": editor.getValue()
                    };
                    fetch("/scriptlet/inventory/draft", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(data)
                    }).then(async (r)=>{
                        if(r.ok)
                            console.debug("save", "Draft Stored");
                        else
                            console.error(r.statusText);
                    }).catch((e)=>console.error("save", e.toString()));
                }
            }

            function save_draft() {
                if(editor_dirty) {
                    save();
                    editor_dirty = false;
                    $("#btn-revert").prop("disabled", false);
                }
                setTimeout(function() { save_draft(); }, 1000);
            }

            async function checkStatus() {
                try {
                    const resp = await fetch(`/scriptlet/inventory/status?set=${set}&name=${name}`);
                    if (resp.ok) {
                        const d = await resp.json();
                        const has = d.has_unstaged;
                        $("#btn-revert").prop("disabled", !has);
                    } else {
                        $("#btn-revert").prop("disabled", true);
                        console.error("Status fetch failed", resp.statusText);
                    }
                } catch (e) {
                    console.error("Status check error", e.toString());
                    $("#btn-revert").prop("disabled", true);
                }
            }

            function rollback() {
                fetch(`/scriptlet/inventory/draft?name=${name}&set=${set}`, {
                    method: "DELETE"
                }).then(async (r)=>{
                    if(r.ok) {
                        console.debug("rollback", "to last revision");
                        refresh();
                    } else
                        console.error(r.statusText);
                }).catch((e)=>console.error(e.toString()));
            }

            $(document).ready(() =>{
                $("#scriptlet-id").text(`${set}::${name}`);

                editor = ace.edit("editor", {
                    // Default to YAML; refresh() switches to JSON if the
                    // server reports the file as .json.
                    mode: "ace/mode/yaml",
                    theme: "ace/theme/twilight",
                    showPrintMargin: false,
                    enableLinking: true,
                    enableBasicAutocompletion: true,
                    enableLiveAutocompletion: true,
                    enableSnippets: true,
                    selectionStyle: "text",
                    fontSize: $("#font-size").val(),
                    useWorker: false,
                    // YAML convention: 2-space soft tabs. Ace's default
                    // is 4, which produces wrong indentation when round-
                    // tripping through yaml.safe_dump (which uses 2).
                    tabSize: 2,
                    useSoftTabs: true
                });

                editor.on("change", ()=>{
                    editor_dirty = true;
                    $("#btn-revert").prop("disabled", false);
                });

                document.addEventListener('keydown', function(e) {
                    if(e.ctrlKey && e.key === 's') {
                        e.preventDefault();
                        save();
                    }
                });

                save_draft();
                refresh();
                setTimeout(checkStatus, 1000);
            });
        </script>
    </head>
    <body class="d-flex flex-column bg-dark h-100">
        <nav class="d-flex flex-column navbar navbar-expand navbar-dark bg-dark align-items-stretch" data-testid="editor-data-navbar">
            <ul class="navbar-nav">
                <li class="navbar-brand m-1">
                    <span class="material-icons-round">data_object</span>
                    <span> Data Editor</span>
                    <span id="scriptlet-id" data-testid="editor-scriptlet-id"></span>
                    <span id="data-ext" class="badge bg-secondary ms-2" data-testid="editor-data-ext"></span>
                </li>
                <li class="nav-item m-1">
                    <button id="btn-revert" type="button" class="btn btn-danger" onclick="rollback()" disabled="disabled" title="Revert to the last committed revision (discards the current draft)" data-testid="editor-revert">
                        <span class="material-icons-round">backspace</span>
                    </button>
                </li>
                <li class="nav-item m-1">
                    <select id="font-size" class="form-select bg-dark text-light" onchange="fontSizeChanged()" title="Editor font size" data-testid="editor-font-size">
                        <option value="8pt">8pt</option>
                        <option value="9pt" selected>9pt</option>
                        <option value="12pt">12pt</option>
                        <option value="13pt">13pt</option>
                    </select>
                </li>
            </ul>
        </nav>

        <div id="editor" class="d-flex flex-column flex-grow-1 mt-1" data-testid="editor-code"></div>
    </body>
</html>
