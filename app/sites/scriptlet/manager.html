<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

		<link rel="stylesheet" href="/files/css/bootstrap/bootstrap.min.css">
        <link rel="stylesheet" href="/files/css/material/material-icons.css">

        <script src="/files/js/jquery.min.js"></script>
        <script src="/files/js/js.cookie.min.js"></script>
        <script src="/files/js/bootstrap/bootstrap.bundle.min.js"></script>

        <script>
            const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
            function setTheme(e) {
                const body = document.body;
                const table = document.querySelector('table');
                if (e.matches) {
                    document.documentElement.setAttribute('data-bs-theme', 'dark');
                    body.classList.remove('bg-body');
                    body.classList.add('bg-dark');
                    if (table) {
                        table.classList.remove('table-secondary');
                        table.classList.add('table-dark');
                    }
                } else {
                    document.documentElement.setAttribute('data-bs-theme', 'light');
                    body.classList.remove('bg-dark');
                    body.classList.add('bg-body');
                    if (table) {
                        table.classList.remove('table-dark');
                        table.classList.add('table-secondary');
                    }
                }
            }
            mediaQuery.addEventListener('change', setTheme);
            $(document).ready(function() {
                setTheme(mediaQuery);
            });
        </script>

        <script>
            'use strict';

            function genTaskActions(set, name) {
                return `
                    <button type="button" onclick="del('${set}', '${name}')" class="btn btn-danger p-0" data-testid="scriptlet-delete-${set}-${name}">
                        <span class="material-icons-round">delete</span>
                    </button>
                    <button type="button" onclick="onEditTask('${set}', '${name}')" class="btn btn-warning p-0" data-testid="scriptlet-edit-${set}-${name}">
                        <span class="material-icons-round">edit</span>
                    </button>
                    <button type="button" onclick="onRunDraftTask('${set}', '${name}')" class="btn btn-success p-0" title="Run draft (kind=draft)" data-testid="scriptlet-run-${set}-${name}">
                        <span class="material-icons-round">play_arrow</span>
                    </button>
                    <button type="button" onclick="onRunTestTask('${set}', '${name}')" class="btn btn-info p-0" title="Run as test (kind=test)" data-testid="scriptlet-test-${set}-${name}">
                        <span class="material-icons-round">science</span>
                    </button>
                `
            }

            function genLibraryActions(set, name) {
                return `
                    <button type="button" onclick="del('${set}', '${name}')" class="btn btn-danger p-0" data-testid="scriptlet-delete-${set}-${name}">
                        <span class="material-icons-round">delete</span>
                    </button>
                    <button type="button" onclick="onEditLibrary('${set}', '${name}')" class="btn btn-warning p-0" data-testid="scriptlet-edit-${set}-${name}">
                        <span class="material-icons-round">edit</span>
                    </button>
                `
            }

            function genViewActions(set, name) {
                return `
                    <button type="button" onclick="del('${set}', '${name}')" class="btn btn-danger p-0" data-testid="scriptlet-delete-${set}-${name}">
                        <span class="material-icons-round">delete</span>
                    </button>
                    <button type="button" onclick="onEditView('${set}', '${name}')" class="btn btn-warning p-0" data-testid="scriptlet-edit-${set}-${name}">
                        <span class="material-icons-round">edit</span>
                    </button>
                `
            }

            function genMdActions(set, name) {
                return `
                    <button type="button" onclick="del('${set}', '${name}')" class="btn btn-danger p-0" data-testid="scriptlet-delete-${set}-${name}"${name == 'README' ? ' disabled' : ''}>
                        <span class="material-icons-round">delete</span>
                    </button>
                    <button type="button" onclick="onEditMd('${set}', '${name}')" class="btn btn-warning p-0" data-testid="scriptlet-edit-${set}-${name}">
                        <span class="material-icons-round">edit</span>
                    </button>
                `
            }

            function genDataActions(set, name) {
                return `
                    <button type="button" onclick="del('${set}', '${name}')" class="btn btn-danger p-0" data-testid="scriptlet-delete-${set}-${name}">
                        <span class="material-icons-round">delete</span>
                    </button>
                    <button type="button" onclick="onEditData('${set}', '${name}')" class="btn btn-warning p-0" data-testid="scriptlet-edit-${set}-${name}">
                        <span class="material-icons-round">edit</span>
                    </button>
                `
            }

            function genActions(set, name, type) {
                let actions = "";
                if(type == "task")
                    actions = genTaskActions(set, name);
                else if(["library", "controller"].includes(type))
                    actions = genLibraryActions(set, name);
                else if(type == "view")
                    actions = genViewActions(set, name);
                else if(type == "markdown")
                    actions = genMdActions(set, name);
                else if(type == "data")
                    actions = genDataActions(set, name);
                return actions;
            }

            function genScriptletRowContent(set, name, type) {
                return `
                    <th scope="row">${set}</th>
                    <th scope="row">${name}</th>
                    <td>${type}</td>
                    <td>${genActions(set, name, type)}</td>
                `;
            }

            function getRowKey(row) {
                const set = $(row).data("set");
                const name = $(row).data("name");
                return `${set}::${name}`;
            }

            function genScriptletItem(set, name, type) {
                return `<tr data-set="${set}" data-name="${name}" data-testid="scriptlet-row-${set}-${name}">${genScriptletRowContent(set, name, type)}</tr>`;
            }

            function refreshList() {
                const scrollY = window.scrollY;
                fetch("/scriptlet/inventory/list").then(async (r)=>{
                    console.debug("GET", "/scriptlet/inventory/list", r)
                    if(r.ok) {
                        const d = await r.json();
                        console.debug("scriptlets", d);
                        const tbody = $("#scriptlets");
                        const existingRows = {};
                        tbody.find("tr").each(function() {
                            const set = $(this).data("set");
                            const name = $(this).data("name");
                            if(set && name) existingRows[`${set}::${name}`] = this;
                        });
                        const newKeys = new Set();
                        for(const i of d) {
                            const key = `${i.set}::${i.name}`;
                            newKeys.add(key);
                            if(existingRows[key]) {
                                $(existingRows[key]).html(genScriptletRowContent(i.set, i.name, i.type));
                            } else {
                                const newRowHtml = genScriptletItem(i.set, i.name, i.type);
                                let inserted = false;
                                tbody.find("tr").each(function() {
                                    const existingKey = getRowKey(this);
                                    if (!inserted && key < existingKey) {
                                        $(this).before(newRowHtml);
                                        inserted = true;
                                        return false;
                                    }
                                });
                                if (!inserted) tbody.append(newRowHtml);
                            }
                        }
                        tbody.find("tr").each(function() {
                            const set = $(this).data("set");
                            const name = $(this).data("name");
                            if(set && name) {
                                const key = `${set}::${name}`;
                                if(!newKeys.has(key)) $(this).remove();
                            }
                        });
                        window.scrollTo(0, scrollY);
                    } else
                        console.error("GET", "/scriptlet/inventory/list", r.statusText);
                }).catch((e)=>console.error("GET", "/scriptlet/inventory/list", e.toString()));
            }

            function enqueueRefreshList() {
                setTimeout(function() { refreshList(); }, 500);
            }

            function clearCreateModal() {
                $("#createModal-error").text("");
                $("#createModal-set").empty().append('<option value="">Select a set</option>');
                $("#createModal-name").val("");
                $("#createModal-type").val("task");
            }

            function populateSets() {
                fetch("/scriptlet/inventory/sets").then(async (r)=>{
                    if(r.ok) {
                        const d = await r.json();
                        console.debug("sets", d.sets);
                        const select = $("#createModal-set");
                        select.empty().append('<option value="">Select a set</option>');
                        for(const set of d.sets) {
                            select.append(`<option value="${set}">${set}</option>`);
                        }
                    } else
                        console.error("GET", "/scriptlet/inventory/sets", r.statusText);
                }).catch((e)=>console.error("GET", "/scriptlet/inventory/sets", e.toString()));
            }

            function onEditTask(set, name) {
                console.debug("onEdit", set, name);

                window.open(`${window.location.origin}/scriptlet/editor_task?set=${set}&name=${name}`,`PyOps - Task Editor ${set}/${name}`,"titlebar=no,toolbar=no,menubar=no,scrollbars=no");
            }

            function onRunDraftTask(set, name) {
                console.debug("onRunDraftTask", set, name);
                fetch("/scriptlet/job/item", {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        set: set,
                        name: name,
                        drop_done: false,
                        param: "",
                        kind: "draft",
                    }),
                }).then(async (r) => {
                    if (r.ok) {
                        const d = await r.json();
                        console.debug("run draft", d.job);
                    } else {
                        const t = await r.text();
                        console.error("run draft failed", r.status, t);
                        alert(`Failed to enqueue draft for ${set}/${name}: ${t}`);
                    }
                }).catch((e) => {
                    console.error("run draft error", e.toString());
                    alert(`Failed to enqueue draft for ${set}/${name}: ${e}`);
                });
            }

            function onRunTestTask(set, name) {
                console.debug("onRunTestTask", set, name);
                fetch("/scriptlet/job/item", {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        set: set,
                        name: name,
                        drop_done: false,
                        param: "",
                        kind: "test",
                    }),
                }).then(async (r) => {
                    if (r.ok) {
                        const d = await r.json();
                        console.debug("run test", d.job);
                    } else {
                        const t = await r.text();
                        console.error("run test failed", r.status, t);
                        alert(`Failed to enqueue test for ${set}/${name}: ${t}`);
                    }
                }).catch((e) => {
                    console.error("run test error", e.toString());
                    alert(`Failed to enqueue test for ${set}/${name}: ${e}`);
                });
            }

            function onEditLibrary(set, name) {
                console.debug("onEdit", set, name);

                window.open(`${window.location.origin}/scriptlet/editor_library?set=${set}&name=${name}`,`PyOps - Library Editor ${set}/${name}`,"titlebar=no,toolbar=no,menubar=no,scrollbars=no");
            }

            function onEditView(set, name) {
                console.debug("onEdit", set, name);

                window.open(`${window.location.origin}/scriptlet/editor_view?set=${set}&name=${name}`,`PyOps - View Editor ${set}/${name}`,"titlebar=no,toolbar=no,menubar=no,scrollbars=no");
            }

            function onEditData(set, name) {
                console.debug("onEdit", set, name);
                window.open(`${window.location.origin}/scriptlet/editor_data?set=${set}&name=${name}`,`PyOps - Data Editor ${set}/${name}`,"titlebar=no,toolbar=no,menubar=no,scrollbars=no");
            }

            function onEditMd(set, name) {
                console.debug("onEdit", set, name);

                window.open(`${window.location.origin}/scriptlet/editor_md?set=${set}&name=${name}`,`PyOps - Markdown Editor ${set}/${name}`,"titlebar=no,toolbar=no,menubar=no,scrollbars=no");
            }

            function onCreate(edit = false) {
                console.debug("onCreate");

                const set = $("#createModal-set").val();
                if (!set) {
                    $("#createModal-error").text("Please select a set");
                    return;
                }
                const name = $("#createModal-name").val();
                const type = $("#createModal-type").val();

                const data = {
                    "set": set,
                    "name": name,
                    "type": type
                }

                console.debug("PUT", "/scriptlet/inventory/item", data);

                fetch("/scriptlet/inventory/item", {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                }).then(async (r)=>{
                    if(r.ok) {
                        $("#createModal").modal('hide');
                        clearCreateModal();
                        enqueueRefreshList();

                        if(edit) {
                            if(["library", "controller"].includes(type))
                                onEditLibrary(set, name);
                            else if(type == "view")
                                onEditView(set, name);
                            else if(type == "task")
                                onEditTask(set, name);
                        }
                    } else {
                        const d = await r.json();
                        $("#createModal-error").text(d.detail);
                    }
                }).catch((e)=>$("#createModal-error").text(e.toString()));
            }

            function del(set, name) {
                console.debug("del");

                if(window.confirm(`are you sure you want to delete ${set}::${name}`)) {
                    console.debug("DELETE", `/scriptlet/inventory/item?set=${set}&name=${name}`);

                    fetch(`/scriptlet/inventory/item?set=${set}&name=${name}`, {
                        method: "DELETE"
                    }).then(async (r)=>{
                        if(r.ok)
                            enqueueRefreshList();
                        else
                            console.error("DELETE", `/scriptlet/inventory/item?set=${set}&name=${name}`, r.statusText);
                    }).catch((e)=>console.error("DELETE", `/scriptlet/inventory/item?set=${set}&name=${name}`, e.toString()));
                }
            }


            $(document).ready(() => {
                refreshList();
                setInterval(function() {
                    refreshList();
                }, 10000);

                // Populate sets when modal is shown
                $("#createModal").on('shown.bs.modal', function () {
                    populateSets();
                });
            });
        </script>
    </head>
    <body class="bg-body">
        <nav class="navbar navbar-expand-md navbar-dark bg-dark pt-3 sticky-top" data-testid="manager-navbar">
            <div class="container-fluid">
                <span class="navbar-brand">
                    <span class="material-icons-round">description</span>
                    <span>Scriptlet/Manager</span>
                </span>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#managerNav" aria-controls="managerNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="managerNav">
                    <ul class="navbar-nav w-100">
                        <li class="nav-item m-1">
                            <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#createModal" data-testid="manager-create">
                                <span class="material-icons-round">add</span>
                            </button>
                        </li>

                        <li class="nav-item mx-auto"></li>

                        <li class="nav-item m-1">
                            <button type="button" class="btn btn-success" onclick="refreshList()" data-testid="manager-refresh">
                                <span class="material-icons-round">refresh</span>
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="table-responsive">
        <table class="table table-secondary" data-testid="manager-table">
            <thead>
              <tr>
                <th scope="col">Set</th>
                <th scope="col">Name</th>
                <th scope="col">Type</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody id="scriptlets" data-testid="manager-scriptlets">
            </tbody>
        </table>
        </div>

        <!-- DIALOGS -->
        <div class="modal fade" data-bs-backdrop="static" id="createModal" tabindex="-1" aria-labelledby="createModalLabel" aria-hidden="true" data-testid="manager-create-modal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="createModalLabel">Create Scriptlet</h5>
                        <!--<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>-->
                        <p id="createModal-error" class="text-danger" data-testid="manager-create-error"></p>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="createModal-set" class="col-form-label">Set:</label>
                            <select id="createModal-set" class="form-select" data-testid="manager-create-set"></select>
                        </div>
                        <div class="mb-3">
                            <label for="createModal-name" class="col-form-label">Name:</label>
                            <input id="createModal-name" type="text" class="form-control" data-testid="manager-create-name">
                        </div>
                        <div class="mb-3">
                            <label for="createModal-type" class="col-form-label">Type:</label>
                            <select  id="createModal-type" class="form-select" data-testid="manager-create-type">
                                <option value="task" selected>Task</option>
                                <option value="library">Library</option>
                                <option value="controller">Controller</option>
                                <option value="view">View</option>
                                <option value="markdown">Markdown</option>
                                <option value="data">Data (YAML)</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger" data-bs-dismiss="modal" data-testid="manager-create-cancel">Cancel</button>
                        <button type="button" class="btn btn-primary" onclick="onCreate()" data-bs-target="#createModal" data-testid="manager-create-submit">Create</button>
                        <button type="button" class="btn btn-secondary" onclick="onCreate(true)" data-bs-target="#createModal" data-testid="manager-create-edit">Create & Edit</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
