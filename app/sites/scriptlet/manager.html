<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

		<link rel="stylesheet" href="/files/css/bootstrap/bootstrap.min.css">
        <link rel="stylesheet" href="/files/css/material/material-icons.css">

        <script src="/files/js/jquery.min.js"></script>
        <script src="/files/js/js.cookie.min.js"></script>
        <script src="/files/js/bootstrap/bootstrap.bundle.min.js"></script>

        <script>
            'use strict';

            function genTaskActions(group, name) {
                return `
                    <button type="button" onclick="del('${group}', '${name}')" class="btn btn-danger p-0">
                        <span class="material-icons-round">delete</span>
                    </button>
                    <button type="button" onclick="onEditTask('${group}', '${name}')" class="btn btn-warning p-0">
                        <span class="material-icons-round">edit</span>
                    </button>
                `
            }

            function genLibraryActions(group, name) {
                return `
                    <button type="button" onclick="del('${group}', '${name}')" class="btn btn-danger p-0">
                        <span class="material-icons-round">delete</span>
                    </button>
                    <button type="button" onclick="onEditLibrary('${group}', '${name}', 'library')" class="btn btn-warning p-0">
                        <span class="material-icons-round">edit</span>
                    </button>
                `
            }

            function genActions(group, name, type) {
                if(type == "task")
                    return genTaskActions(group, name);
                else if(type == "library")
                    return genLibraryActions(group, name);
            }

            function genScriptletItem(group, name, description, type) {
                return `
                    <tr>
                        <th scope="row">${group}</th>
                        <th scope="row">${name}</th>
                        <td>${description}</td>
                        <td>${type}</td>
                        <td>${genActions(group, name, type)}</td>
                    </tr>
                `;
            }

            function refreshList() {
                $("#scriptlets").empty();
                fetch("/scriptlet/inventory/list").then(async (r)=>{
                    console.debug("GET", "/scriptlet/inventory/list", r)
                    if(r.ok) {
                        const d = await r.json();
                        console.debug("scriptlets", d);
                        for(const i of d)
                            $("#scriptlets").append(genScriptletItem(i.group, i.name, i.description, i.type));
                    } else
                        console.error("GET", "/scriptlet/inventory/list", r.statusText);
                }).catch((e)=>console.error("GET", "/scriptlet/inventory/list", e.toString()));
            }

            function enqueueRefreshList() {
                setTimeout(function() { refreshList(); }, 500);
            }

            function clearCreateModal() {
                $("#createModal-error").text("");
                $("#createModal-group").val("");
                $("#createModal-name").val("");
                $("#createModal-type").val("task");
            }

            function onEditTask(group, name) {
                console.debug("onEdit", group, name);

                window.open(`${window.location.origin}/scriptlet/editor_task?group=${group}&name=${name}`,`InfraOps - Scriptlet/Editor ${group}/${name}`,"titlebar=no,toolbar=no,menubar=no,scrollbars=no");
            }

            function onEditLibrary(group, name) {
                console.debug("onEdit", group, name);

                window.open(`${window.location.origin}/scriptlet/editor_library?group=${group}&name=${name}`,`InfraOps - Scriptlet/Editor ${group}/${name}`,"titlebar=no,toolbar=no,menubar=no,scrollbars=no");
            }

            function onCreate(edit = false) {
                console.debug("onCreate");

                const group = $("#createModal-group").val();
                const name = $("#createModal-name").val();
                const type = $("#createModal-type").val();

                const data = {
                    "group": group,
                    "name": name,
                    "type": type
                }

                console.debug("PUT", "/scriptlet/inventory/item", data);

                fetch("/scriptlet/inventory/item", {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                }).then(async (r)=>{
                    if(r.ok) {
                        $("#createModal").modal('hide');
                        clearCreateModal();
                        enqueueRefreshList();

                        if(edit) {
                            if(type == "library")
                                onEditLibrary(group, name);
                            else if(type == "task")
                                onEditTask(group, name);
                        }
                    } else {
                        const d = await r.json();
                        $("#createModal-error").text(d.detail);
                    }
                }).catch((e)=>$("#createModal-error").text(e.toString()));
            }

            function del(group, name) {
                console.debug("del");

                if(window.confirm(`are you sure you want to delete ${group}::${name}`)) {
                    console.debug("DELETE", `/scriptlet/inventory/item?group=${group}&name=${name}`);

                    fetch(`/scriptlet/inventory/item?group=${group}&name=${name}`, {
                        method: "DELETE"
                    }).then(async (r)=>{
                        if(r.ok)
                            enqueueRefreshList();
                        else
                            console.error("DELETE", `/scriptlet/inventory/item?group=${group}&name=${name}`, r.statusText);
                    }).catch((e)=>console.error("DELETE", `/scriptlet/inventory/item?group=${group}&name=${name}`, e.toString()));
                }
            }

            $(document).ready(() => {
                refreshList();
            });
        </script>
    </head>
    <body class="bg-light">
        <nav class="navbar navbar-expand navbar-dark bg-dark pt-3">
            <ul class="navbar-nav w-100">
                <li class="navbar-brand">
                    <span class="material-icons-round">description</span>
                    <span>Scriptlet/Manager</span>
                </li>
                
                <li class="nav-item m-1">
                    <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#createModal">
                        <span class="material-icons-round">add</span>
                    </button>
                </li>

                <li class="nav-item mx-auto"></li>

                <li class="nav-item m-1">
                    <button type="button" class="btn btn-success" onclick="refreshList()">
                        <span class="material-icons-round">refresh</span>
                    </button>
                </li>
            </ul>
        </nav>

        <table class="table table-secondary">
            <thead>
              <tr>
                <th scope="col">Group</th>
                <th scope="col">Name</th>
                <th scope="col">Description</th>
                <th scope="col">Type</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody id="scriptlets">
            </tbody>
        </table>

        <!-- DIALOGS -->
        <div class="modal fade" data-bs-backdrop="static" id="createModal" tabindex="-1" aria-labelledby="createModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="createModalLabel">Create Scriptlet</h5>
                        <!--<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>-->
                        <p id="createModal-error" class="text-danger"></p>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="createModal-group" class="col-form-label">Group:</label>
                            <input id="createModal-group" type="text" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label for="createModal-name" class="col-form-label">Name:</label>
                            <input id="createModal-name" type="text" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label for="createModal-type" class="col-form-label">Type:</label>
                            <select  id="createModal-type" class="form-select">
                                <option value="task" selected>Task</option>
                                <option value="library">Library</option>
                                <!--
                                <option value="model">Model</option>
                                <option value="controller">Controller</option>
                                <option value="view">View</option>
                                -->
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary" onclick="onCreate()" data-bs-target="#createModal">Create</button>
                        <button type="button" class="btn btn-secondary" onclick="onCreate(true)" data-bs-target="#createModal">Create & Edit</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
