<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

		<link rel="stylesheet" href="/files/css/bootstrap/bootstrap.min.css">
        <link rel="stylesheet" href="/files/css/material/material-icons.css">

        <script src="/files/js/jquery.min.js"></script>
        <script src="/files/js/js.cookie.min.js"></script>
        <script src="/files/js/bootstrap/bootstrap.bundle.min.js"></script>

        <script>
            const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
            function setTheme(e) {
                const body = document.body;
                const table = document.querySelector('table');
                if (e.matches) {
                    document.documentElement.setAttribute('data-bs-theme', 'dark');
                    body.classList.remove('bg-body');
                    body.classList.add('bg-dark');
                    if (table) {
                        table.classList.remove('table-secondary');
                        table.classList.add('table-dark');
                    }
                } else {
                    document.documentElement.setAttribute('data-bs-theme', 'light');
                    body.classList.remove('bg-dark');
                    body.classList.add('bg-body');
                    if (table) {
                        table.classList.remove('table-dark');
                        table.classList.add('table-secondary');
                    }
                }
            }
            mediaQuery.addEventListener('change', setTheme);
            $(document).ready(function() {
                setTheme(mediaQuery);
            });
        </script>

        <script>
            'use strict';

            function genTaskActions(set, name) {
                return `
                    <button type="button" onclick="del('${set}', '${name}')" class="btn btn-danger p-0">
                        <span class="material-icons-round">delete</span>
                    </button>
                    <button type="button" onclick="onEditTask('${set}', '${name}')" class="btn btn-warning p-0">
                        <span class="material-icons-round">edit</span>
                    </button>
                `
            }

            function genLibraryActions(set, name) {
                return `
                    <button type="button" onclick="del('${set}', '${name}')" class="btn btn-danger p-0">
                        <span class="material-icons-round">delete</span>
                    </button>
                    <button type="button" onclick="onEditLibrary('${set}', '${name}')" class="btn btn-warning p-0">
                        <span class="material-icons-round">edit</span>
                    </button>
                `
            }

            function genViewActions(set, name) {
                return `
                    <button type="button" onclick="del('${set}', '${name}')" class="btn btn-danger p-0">
                        <span class="material-icons-round">delete</span>
                    </button>
                    <button type="button" onclick="onEditView('${set}', '${name}')" class="btn btn-warning p-0">
                        <span class="material-icons-round">edit</span>
                    </button>
                `
            }

            function genMdActions(set, name) {
                return `
                    <button type="button" onclick="del('${set}', '${name}')" class="btn btn-danger p-0"${name == 'README' ? ' disabled' : ''}>
                        <span class="material-icons-round">delete</span>
                    </button>
                    <button type="button" onclick="onEditMd('${set}', '${name}')" class="btn btn-warning p-0">
                        <span class="material-icons-round">edit</span>
                    </button>
                `
            }

            function genActions(set, name, type) {
                let actions = "";
                if(type == "task")
                    actions = genTaskActions(set, name);
                else if(["library", "controller"].includes(type))
                    actions = genLibraryActions(set, name);
                else if(type == "view")
                    actions = genViewActions(set, name);
                else if(type == "markdown")
                    actions = genMdActions(set, name);
                return actions + `
                    <button type="button" class="btn btn-danger p-0 save-rev-btn" onclick="saveRevision('${set}', '${name}')" disabled>
                        <span class="material-icons-round">save_alt</span>
                    </button>
                `;
            }

            function genScriptletItem(set, name, type) {
                return `
                    <tr>
                        <th scope="row">${set}</th>
                        <th scope="row">${name}</th>
                        <td>${type}</td>
                        <td>${genActions(set, name, type)}</td>
                    </tr>
                `;
            }

            function refreshList() {
                $("#scriptlets").empty();
                fetch("/scriptlet/inventory/list").then(async (r)=>{
                    console.debug("GET", "/scriptlet/inventory/list", r)
                    if(r.ok) {
                        const d = await r.json();
                        console.debug("scriptlets", d);
                        for(const i of d)
                            $("#scriptlets").append(genScriptletItem(i.set, i.name, i.type));
                        checkStatuses();
                    } else
                        console.error("GET", "/scriptlet/inventory/list", r.statusText);
                }).catch((e)=>console.error("GET", "/scriptlet/inventory/list", e.toString()));
            }

            function enqueueRefreshList() {
                setTimeout(function() { refreshList(); }, 500);
            }

            function clearCreateModal() {
                $("#createModal-error").text("");
                $("#createModal-set").empty().append('<option value="">Select a set</option>');
                $("#createModal-name").val("");
                $("#createModal-type").val("task");
            }

            function populateSets() {
                fetch("/scriptlet/inventory/sets").then(async (r)=>{
                    if(r.ok) {
                        const d = await r.json();
                        console.debug("sets", d.sets);
                        const select = $("#createModal-set");
                        select.empty().append('<option value="">Select a set</option>');
                        for(const set of d.sets) {
                            select.append(`<option value="${set}">${set}</option>`);
                        }
                    } else
                        console.error("GET", "/scriptlet/inventory/sets", r.statusText);
                }).catch((e)=>console.error("GET", "/scriptlet/inventory/sets", e.toString()));
            }

            function onEditTask(set, name) {
                console.debug("onEdit", set, name);

                window.open(`${window.location.origin}/scriptlet/editor_task?set=${set}&name=${name}`,`PyOps - Task Editor ${set}/${name}`,"titlebar=no,toolbar=no,menubar=no,scrollbars=no");
            }

            function onEditLibrary(set, name) {
                console.debug("onEdit", set, name);

                window.open(`${window.location.origin}/scriptlet/editor_library?set=${set}&name=${name}`,`PyOps - Library Editor ${set}/${name}`,"titlebar=no,toolbar=no,menubar=no,scrollbars=no");
            }

            function onEditView(set, name) {
                console.debug("onEdit", set, name);

                window.open(`${window.location.origin}/scriptlet/editor_view?set=${set}&name=${name}`,`PyOps - View Editor ${set}/${name}`,"titlebar=no,toolbar=no,menubar=no,scrollbars=no");
            }

            function onEditMd(set, name) {
                console.debug("onEdit", set, name);

                window.open(`${window.location.origin}/scriptlet/editor_md?set=${set}&name=${name}`,`PyOps - Markdown Editor ${set}/${name}`,"titlebar=no,toolbar=no,menubar=no,scrollbars=no");
            }

            function onCreate(edit = false) {
                console.debug("onCreate");

                const set = $("#createModal-set").val();
                if (!set) {
                    $("#createModal-error").text("Please select a set");
                    return;
                }
                const name = $("#createModal-name").val();
                const type = $("#createModal-type").val();

                const data = {
                    "set": set,
                    "name": name,
                    "type": type
                }

                console.debug("PUT", "/scriptlet/inventory/item", data);

                fetch("/scriptlet/inventory/item", {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                }).then(async (r)=>{
                    if(r.ok) {
                        $("#createModal").modal('hide');
                        clearCreateModal();
                        enqueueRefreshList();

                        if(edit) {
                            if(["library", "controller"].includes(type))
                                onEditLibrary(set, name);
                            else if(type == "view")
                                onEditView(set, name);
                            else if(type == "task")
                                onEditTask(set, name);
                        }
                    } else {
                        const d = await r.json();
                        $("#createModal-error").text(d.detail);
                    }
                }).catch((e)=>$("#createModal-error").text(e.toString()));
            }

            function del(set, name) {
                console.debug("del");

                if(window.confirm(`are you sure you want to delete ${set}::${name}`)) {
                    console.debug("DELETE", `/scriptlet/inventory/item?set=${set}&name=${name}`);

                    fetch(`/scriptlet/inventory/item?set=${set}&name=${name}`, {
                        method: "DELETE"
                    }).then(async (r)=>{
                        if(r.ok)
                            enqueueRefreshList();
                        else
                            console.error("DELETE", `/scriptlet/inventory/item?set=${set}&name=${name}`, r.statusText);
                    }).catch((e)=>console.error("DELETE", `/scriptlet/inventory/item?set=${set}&name=${name}`, e.toString()));
                }
            }

            async function saveRevision(set, name) {
                console.debug("saveRevision", set, name);
                try {
                    const codeResp = await fetch(`/scriptlet/inventory/code?set=${set}&name=${name}`);
                    if (!codeResp.ok) {
                        console.error("Failed to fetch code", codeResp.statusText);
                        return;
                    }
                    const codeData = await codeResp.json();
                    const data = {
                        "set": set,
                        "name": name,
                        "code": codeData.code
                    };
                    const saveResp = await fetch("/scriptlet/inventory/item", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(data)
                    });
                    if (saveResp.ok) {
                        console.debug("Revision saved");
                        enqueueRefreshList();
                    } else {
                        console.error("Failed to save revision", saveResp.statusText);
                    }
                } catch (e) {
                    console.error("saveRevision error", e.toString());
                }
            }

            function checkStatuses() {
                const rows = $("#scriptlets tr");
                const promises = [];
                rows.each(function() {
                    const set = $(this).find("th").eq(0).text();
                    const name = $(this).find("th").eq(1).text();
                    if (set && name) {
                        promises.push(
                            fetch(`/scriptlet/inventory/status?set=${set}&name=${name}`).then(async (r) => {
                                const btn = $(this).find(".save-rev-btn");
                                if (r.ok) {
                                    const d = await r.json();
                                    console.log(`Status for ${set}::${name}:`, d.has_unstaged);
                                    btn.prop("disabled", !d.has_unstaged);
                                } else {
                                    btn.prop("disabled", true);
                                    console.error("Status fetch failed", r.statusText);
                                }
                            }).catch((e) => {
                                console.error("Status fetch error", e.toString());
                                $(this).find(".save-rev-btn").prop("disabled", true);
                            })
                        );
                    }
                });
                if (promises.length > 0) {
                    Promise.all(promises).catch((e) => console.error("Batch status error", e));
                }
            }

            $(document).ready(() => {
                refreshList();
                setInterval(function() {
                    refreshList();
                }, 10000);

                // Populate sets when modal is shown
                $("#createModal").on('shown.bs.modal', function () {
                    populateSets();
                });
            });
        </script>
    </head>
    <body class="bg-body">
        <nav class="navbar navbar-expand navbar-dark bg-dark pt-3">
            <ul class="navbar-nav w-100">
                <li class="navbar-brand">
                    <span class="material-icons-round">description</span>
                    <span>Scriptlet/Manager</span>
                </li>
                
                <li class="nav-item m-1">
                    <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#createModal">
                        <span class="material-icons-round">add</span>
                    </button>
                </li>

                <li class="nav-item mx-auto"></li>

                <li class="nav-item m-1">
                    <button type="button" class="btn btn-success" onclick="refreshList()">
                        <span class="material-icons-round">refresh</span>
                    </button>
                </li>
            </ul>
        </nav>

        <table class="table table-secondary">
            <thead>
              <tr>
                <th scope="col">Set</th>
                <th scope="col">Name</th>
                <th scope="col">Type</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody id="scriptlets">
            </tbody>
        </table>

        <!-- DIALOGS -->
        <div class="modal fade" data-bs-backdrop="static" id="createModal" tabindex="-1" aria-labelledby="createModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="createModalLabel">Create Scriptlet</h5>
                        <!--<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>-->
                        <p id="createModal-error" class="text-danger"></p>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="createModal-set" class="col-form-label">Set:</label>
                            <select id="createModal-set" class="form-select"></select>
                        </div>
                        <div class="mb-3">
                            <label for="createModal-name" class="col-form-label">Name:</label>
                            <input id="createModal-name" type="text" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label for="createModal-type" class="col-form-label">Type:</label>
                            <select  id="createModal-type" class="form-select">
                                <option value="task" selected>Task</option>
                                <option value="library">Library</option>
                                <option value="controller">Controller</option>
                                <option value="view">View</option>
                                <!--
                                <option value="model">Model</option>
                                <option value="view">View</option>
                                -->
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary" onclick="onCreate()" data-bs-target="#createModal">Create</button>
                        <button type="button" class="btn btn-secondary" onclick="onCreate(true)" data-bs-target="#createModal">Create & Edit</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
