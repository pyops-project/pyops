<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

		<link rel="stylesheet" href="/files/css/bootstrap/bootstrap.min.css">
        <link rel="stylesheet" href="/files/css/material/material-icons.css">
        <style>
            .set-chevron { transition: transform 0.15s ease; }
            [data-bs-toggle="collapse"][aria-expanded="true"] .set-chevron { transform: rotate(90deg); }
            .set-card-header .badge { font-weight: normal; }

            /* Below the navbar-expand-md breakpoint the toolbar collapses;
               lay its icons out in a single horizontally-scrollable row
               instead of stacking them vertically. */
            @media (max-width: 767.98px) {
                .navbar-collapse .navbar-nav {
                    flex-direction: row;
                    flex-wrap: nowrap;
                    overflow-x: auto;
                }
            }
        </style>

        <script src="/files/js/jquery.min.js"></script>
        <script src="/files/js/js.cookie.min.js"></script>
        <script src="/files/js/bootstrap/bootstrap.bundle.min.js"></script>

        <script>
            const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
            function currentTableClass() {
                return mediaQuery.matches ? 'table-dark' : 'table-secondary';
            }
            function setTheme(e) {
                const body = document.body;
                const tables = document.querySelectorAll('table');
                if (e.matches) {
                    document.documentElement.setAttribute('data-bs-theme', 'dark');
                    body.classList.remove('bg-body');
                    body.classList.add('bg-dark');
                    tables.forEach((t) => { t.classList.remove('table-secondary'); t.classList.add('table-dark'); });
                } else {
                    document.documentElement.setAttribute('data-bs-theme', 'light');
                    body.classList.remove('bg-dark');
                    body.classList.add('bg-body');
                    tables.forEach((t) => { t.classList.remove('table-dark'); t.classList.add('table-secondary'); });
                }
            }
            mediaQuery.addEventListener('change', setTheme);
            $(document).ready(function() {
                setTheme(mediaQuery);
            });
        </script>

        <script>
            'use strict';

            function genTaskActions(set, name) {
                return `
                    <button type="button" onclick="del('${set}', '${name}')" class="btn btn-danger p-0" title="Delete this scriptlet" data-testid="scriptlet-delete-${set}-${name}">
                        <span class="material-icons-round">delete</span>
                    </button>
                    <button type="button" onclick="onEditTask('${set}', '${name}')" class="btn btn-warning p-0" title="Open in the Task editor" data-testid="scriptlet-edit-${set}-${name}">
                        <span class="material-icons-round">edit</span>
                    </button>
                    <button type="button" onclick="onRunDraftTask('${set}', '${name}')" class="btn btn-success p-0" title="Run draft (kind=draft)" data-testid="scriptlet-run-${set}-${name}">
                        <span class="material-icons-round">play_arrow</span>
                    </button>
                    <button type="button" onclick="onRunTestTask('${set}', '${name}')" class="btn btn-info p-0" title="Run as test (kind=test)" data-testid="scriptlet-test-${set}-${name}">
                        <span class="material-icons-round">science</span>
                    </button>
                `
            }

            function genLibraryActions(set, name) {
                return `
                    <button type="button" onclick="del('${set}', '${name}')" class="btn btn-danger p-0" title="Delete this scriptlet" data-testid="scriptlet-delete-${set}-${name}">
                        <span class="material-icons-round">delete</span>
                    </button>
                    <button type="button" onclick="onEditLibrary('${set}', '${name}')" class="btn btn-warning p-0" title="Open in the Library editor" data-testid="scriptlet-edit-${set}-${name}">
                        <span class="material-icons-round">edit</span>
                    </button>
                `
            }

            function genViewActions(set, name) {
                return `
                    <button type="button" onclick="del('${set}', '${name}')" class="btn btn-danger p-0" title="Delete this scriptlet" data-testid="scriptlet-delete-${set}-${name}">
                        <span class="material-icons-round">delete</span>
                    </button>
                    <button type="button" onclick="onEditView('${set}', '${name}')" class="btn btn-warning p-0" title="Open in the View editor" data-testid="scriptlet-edit-${set}-${name}">
                        <span class="material-icons-round">edit</span>
                    </button>
                `
            }

            function genMdActions(set, name) {
                return `
                    <button type="button" onclick="del('${set}', '${name}')" class="btn btn-danger p-0" title="Delete this markdown page (README can't be deleted)" data-testid="scriptlet-delete-${set}-${name}"${name == 'README' ? ' disabled' : ''}>
                        <span class="material-icons-round">delete</span>
                    </button>
                    <button type="button" onclick="onEditMd('${set}', '${name}')" class="btn btn-warning p-0" title="Open in the Markdown editor" data-testid="scriptlet-edit-${set}-${name}">
                        <span class="material-icons-round">edit</span>
                    </button>
                `
            }

            function genDataActions(set, name) {
                return `
                    <button type="button" onclick="del('${set}', '${name}')" class="btn btn-danger p-0" title="Delete this scriptlet" data-testid="scriptlet-delete-${set}-${name}">
                        <span class="material-icons-round">delete</span>
                    </button>
                    <button type="button" onclick="onEditData('${set}', '${name}')" class="btn btn-warning p-0" title="Open in the Data editor" data-testid="scriptlet-edit-${set}-${name}">
                        <span class="material-icons-round">edit</span>
                    </button>
                `
            }

            function genActions(set, name, type) {
                let actions = "";
                if(type == "task")
                    actions = genTaskActions(set, name);
                else if(["library", "controller"].includes(type))
                    actions = genLibraryActions(set, name);
                else if(type == "view")
                    actions = genViewActions(set, name);
                else if(type == "markdown")
                    actions = genMdActions(set, name);
                else if(type == "data")
                    actions = genDataActions(set, name);
                return actions;
            }

            function genStatusIcon(set, name, has_unstaged) {
                // `has_unstaged` flag is stamped by `git.list_scriptlets()`
                // against `git status --porcelain` per set. Visual parity
                // with the VSIX manager tree: ✓ for synced, ⚠ for unstaged
                // (draft / new / modified). Tested via the
                // `scriptlet-status-{set}-{name}` testid + `data-status`.
                if (has_unstaged) {
                    return `<span class="material-icons-round text-warning align-middle me-1" `
                        + `title="unstaged draft (not committed)" `
                        + `style="font-size:1.1em" `
                        + `data-testid="scriptlet-status-${set}-${name}" `
                        + `data-status="dirty">change_history</span>`;
                }
                return `<span class="material-icons-round text-success align-middle me-1" `
                    + `title="synced (committed)" `
                    + `style="font-size:1.1em" `
                    + `data-testid="scriptlet-status-${set}-${name}" `
                    + `data-status="clean">check</span>`;
            }

            function genScriptletRowContent(set, name, type, has_unstaged) {
                // The set is now the collapsible group header, so the row
                // no longer carries a Set column.
                return `
                    <th scope="row">${genStatusIcon(set, name, has_unstaged)}${name}</th>
                    <td>${type}</td>
                    <td>${genActions(set, name, type)}</td>
                `;
            }

            // One collapsible Bootstrap card per set, collapsed by default.
            // refreshList only ever *creates* a section that doesn't exist
            // yet — existing sections (and thus their expanded/collapsed
            // state) survive the 10s auto-refresh untouched.
            function genSetSection(set) {
                const bodyId = `manager-set-body-${set}`;
                return `
                    <div class="card mb-2" data-set="${set}" data-testid="manager-set-${set}">
                        <div class="card-header set-card-header p-0">
                            <button class="btn btn-link text-reset text-decoration-none w-100 text-start d-flex align-items-center collapsed"
                                    type="button" data-bs-toggle="collapse" data-bs-target="#${bodyId}"
                                    aria-expanded="false" aria-controls="${bodyId}"
                                    title="Expand/collapse this set" data-testid="manager-set-toggle-${set}">
                                <span class="material-icons-round set-chevron">chevron_right</span>
                                <span class="fw-bold ms-1">${set}</span>
                                <span class="badge bg-secondary ms-2" data-set-count>0</span>
                            </button>
                        </div>
                        <div id="${bodyId}" class="collapse">
                            <div class="table-responsive">
                                <table class="table ${currentTableClass()}" data-testid="manager-table-${set}">
                                    <thead>
                                        <tr>
                                            <th scope="col">Name</th>
                                            <th scope="col">Type</th>
                                            <th scope="col">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody data-set-body="${set}"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>`;
            }

            function ensureSetSection(set) {
                const container = $("#sets-container");
                let card = container.children(`[data-set="${set}"]`);
                if (card.length) return card;
                const html = genSetSection(set);
                let inserted = false;
                container.children("[data-set]").each(function() {
                    if (!inserted && set < $(this).attr("data-set")) {
                        $(this).before(html);
                        inserted = true;
                        return false;
                    }
                });
                if (!inserted) container.append(html);
                return container.children(`[data-set="${set}"]`);
            }

            function genScriptletItem(set, name, type, has_unstaged) {
                return `<tr data-set="${set}" data-name="${name}" data-testid="scriptlet-row-${set}-${name}">${genScriptletRowContent(set, name, type, has_unstaged)}</tr>`;
            }

            function refreshList() {
                const scrollY = window.scrollY;
                Promise.all([fetch("/scriptlet/inventory/list"), fetch("/scriptlet/inventory/sets")]).then(async ([r, rs])=>{
                    console.debug("GET", "/scriptlet/inventory/list", r)
                    if(!rs.ok) {
                        console.error("GET", "/scriptlet/inventory/sets", rs.statusText);
                        return;
                    }
                    if(r.ok) {
                        const d = await r.json();
                        const sets = (await rs.json()).sets;
                        console.debug("scriptlets", d, "sets", sets);

                        // Every set gets a section — also one without
                        // scriptlets yet. Group incoming scriptlets by set;
                        // within a set the row key is the scriptlet name.
                        const bySet = {};
                        for(const set of sets) bySet[set] = [];
                        for(const i of d) (bySet[i.set] = bySet[i.set] || []).push(i);

                        for(const set of Object.keys(bySet)) {
                            const card = ensureSetSection(set);
                            const tbody = card.find("tbody");
                            const items = bySet[set];
                            const existingRows = {};
                            tbody.find("tr").each(function() {
                                const name = $(this).attr("data-name");
                                if(name) existingRows[name] = this;
                            });
                            const newKeys = new Set();
                            for(const i of items) {
                                const key = i.name;
                                newKeys.add(key);
                                if(existingRows[key]) {
                                    $(existingRows[key]).html(genScriptletRowContent(i.set, i.name, i.type, i.has_unstaged));
                                } else {
                                    const newRowHtml = genScriptletItem(i.set, i.name, i.type, i.has_unstaged);
                                    let inserted = false;
                                    tbody.find("tr").each(function() {
                                        if (!inserted && key < $(this).attr("data-name")) {
                                            $(this).before(newRowHtml);
                                            inserted = true;
                                            return false;
                                        }
                                    });
                                    if (!inserted) tbody.append(newRowHtml);
                                }
                            }
                            tbody.find("tr").each(function() {
                                const name = $(this).attr("data-name");
                                if(name && !newKeys.has(name)) $(this).remove();
                            });
                            card.find("[data-set-count]").text(items.length);
                        }

                        // Drop sets that no longer exist.
                        const liveSets = new Set(Object.keys(bySet));
                        $("#sets-container").children("[data-set]").each(function() {
                            if(!liveSets.has($(this).attr("data-set"))) $(this).remove();
                        });

                        window.scrollTo(0, scrollY);
                    } else
                        console.error("GET", "/scriptlet/inventory/list", r.statusText);
                }).catch((e)=>console.error("GET", "/scriptlet/inventory/list or /sets", e.toString()));
            }

            function enqueueRefreshList() {
                setTimeout(function() { refreshList(); }, 500);
            }

            function clearCreateModal() {
                $("#createModal-error").text("");
                $("#createModal-set").empty().append('<option value="">Select a set</option>');
                $("#createModal-name").val("");
                $("#createModal-type").val("task");
            }

            function populateSets() {
                fetch("/scriptlet/inventory/sets").then(async (r)=>{
                    if(r.ok) {
                        const d = await r.json();
                        console.debug("sets", d.sets);
                        const select = $("#createModal-set");
                        select.empty().append('<option value="">Select a set</option>');
                        for(const set of d.sets) {
                            select.append(`<option value="${set}">${set}</option>`);
                        }
                    } else
                        console.error("GET", "/scriptlet/inventory/sets", r.statusText);
                }).catch((e)=>console.error("GET", "/scriptlet/inventory/sets", e.toString()));
            }

            function onEditTask(set, name) {
                console.debug("onEdit", set, name);

                window.open(`${window.location.origin}/scriptlet/editor_task?set=${set}&name=${name}`,`PyOps - Task Editor ${set}/${name}`,"titlebar=no,toolbar=no,menubar=no,scrollbars=no");
            }

            function onRunDraftTask(set, name) {
                console.debug("onRunDraftTask", set, name);
                fetch("/scriptlet/job/item", {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        set: set,
                        name: name,
                        drop_done: false,
                        param: "",
                        kind: "draft",
                    }),
                }).then(async (r) => {
                    if (r.ok) {
                        const d = await r.json();
                        console.debug("run draft", d.job);
                    } else {
                        const t = await r.text();
                        console.error("run draft failed", r.status, t);
                        alert(`Failed to enqueue draft for ${set}/${name}: ${t}`);
                    }
                }).catch((e) => {
                    console.error("run draft error", e.toString());
                    alert(`Failed to enqueue draft for ${set}/${name}: ${e}`);
                });
            }

            function onRunTestTask(set, name) {
                console.debug("onRunTestTask", set, name);
                fetch("/scriptlet/job/item", {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        set: set,
                        name: name,
                        drop_done: false,
                        param: "",
                        kind: "test",
                    }),
                }).then(async (r) => {
                    if (r.ok) {
                        const d = await r.json();
                        console.debug("run test", d.job);
                    } else {
                        const t = await r.text();
                        console.error("run test failed", r.status, t);
                        alert(`Failed to enqueue test for ${set}/${name}: ${t}`);
                    }
                }).catch((e) => {
                    console.error("run test error", e.toString());
                    alert(`Failed to enqueue test for ${set}/${name}: ${e}`);
                });
            }

            function onEditLibrary(set, name) {
                console.debug("onEdit", set, name);

                window.open(`${window.location.origin}/scriptlet/editor_library?set=${set}&name=${name}`,`PyOps - Library Editor ${set}/${name}`,"titlebar=no,toolbar=no,menubar=no,scrollbars=no");
            }

            function onEditView(set, name) {
                console.debug("onEdit", set, name);

                window.open(`${window.location.origin}/scriptlet/editor_view?set=${set}&name=${name}`,`PyOps - View Editor ${set}/${name}`,"titlebar=no,toolbar=no,menubar=no,scrollbars=no");
            }

            function onEditData(set, name) {
                console.debug("onEdit", set, name);
                window.open(`${window.location.origin}/scriptlet/editor_data?set=${set}&name=${name}`,`PyOps - Data Editor ${set}/${name}`,"titlebar=no,toolbar=no,menubar=no,scrollbars=no");
            }

            function onEditMd(set, name) {
                console.debug("onEdit", set, name);

                window.open(`${window.location.origin}/scriptlet/editor_md?set=${set}&name=${name}`,`PyOps - Markdown Editor ${set}/${name}`,"titlebar=no,toolbar=no,menubar=no,scrollbars=no");
            }

            function onCreate(edit = false) {
                console.debug("onCreate");

                const set = $("#createModal-set").val();
                if (!set) {
                    $("#createModal-error").text("Please select a set");
                    return;
                }
                const name = $("#createModal-name").val();
                const type = $("#createModal-type").val();

                const data = {
                    "set": set,
                    "name": name,
                    "type": type
                }

                console.debug("PUT", "/scriptlet/inventory/item", data);

                fetch("/scriptlet/inventory/item", {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                }).then(async (r)=>{
                    if(r.ok) {
                        $("#createModal").modal('hide');
                        clearCreateModal();
                        enqueueRefreshList();

                        if(edit) {
                            if(["library", "controller"].includes(type))
                                onEditLibrary(set, name);
                            else if(type == "view")
                                onEditView(set, name);
                            else if(type == "task")
                                onEditTask(set, name);
                        }
                    } else {
                        const d = await r.json();
                        $("#createModal-error").text(d.detail);
                    }
                }).catch((e)=>$("#createModal-error").text(e.toString()));
            }

            function del(set, name) {
                console.debug("del");

                if(window.confirm(`are you sure you want to delete ${set}::${name}`)) {
                    console.debug("DELETE", `/scriptlet/inventory/item?set=${set}&name=${name}`);

                    fetch(`/scriptlet/inventory/item?set=${set}&name=${name}`, {
                        method: "DELETE"
                    }).then(async (r)=>{
                        if(r.ok)
                            enqueueRefreshList();
                        else
                            console.error("DELETE", `/scriptlet/inventory/item?set=${set}&name=${name}`, r.statusText);
                    }).catch((e)=>console.error("DELETE", `/scriptlet/inventory/item?set=${set}&name=${name}`, e.toString()));
                }
            }


            $(document).ready(() => {
                refreshList();
                setInterval(function() {
                    refreshList();
                }, 10000);

                // Populate sets when modal is shown
                $("#createModal").on('shown.bs.modal', function () {
                    populateSets();
                });
            });
        </script>
    </head>
    <body class="bg-body">
        <nav class="navbar navbar-expand-md navbar-dark bg-dark pt-3 sticky-top" data-testid="manager-navbar">
            <div class="container-fluid">
                <span class="navbar-brand">
                    <span class="material-icons-round">description</span>
                    <span>Scriptlet/Manager</span>
                </span>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#managerNav" aria-controls="managerNav" aria-expanded="false" title="Show/hide the toolbar" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="managerNav">
                    <ul class="navbar-nav w-100">
                        <li class="nav-item m-1">
                            <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#createModal" title="Create a new scriptlet" data-testid="manager-create">
                                <span class="material-icons-round">add</span>
                            </button>
                        </li>

                        <li class="nav-item mx-auto"></li>

                        <li class="nav-item m-1">
                            <button type="button" class="btn btn-success" onclick="refreshList()" title="Reload the scriptlet list" data-testid="manager-refresh">
                                <span class="material-icons-round">refresh</span>
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container-fluid mt-2" id="sets-container" data-testid="manager-sets">
        </div>

        <!-- DIALOGS -->
        <div class="modal fade" data-bs-backdrop="static" id="createModal" tabindex="-1" aria-labelledby="createModalLabel" aria-hidden="true" data-testid="manager-create-modal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="createModalLabel">Create Scriptlet</h5>
                        <!--<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>-->
                        <p id="createModal-error" class="text-danger" data-testid="manager-create-error"></p>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="createModal-set" class="col-form-label">Set:</label>
                            <select id="createModal-set" class="form-select" data-testid="manager-create-set"></select>
                        </div>
                        <div class="mb-3">
                            <label for="createModal-name" class="col-form-label">Name:</label>
                            <input id="createModal-name" type="text" class="form-control" data-testid="manager-create-name">
                        </div>
                        <div class="mb-3">
                            <label for="createModal-type" class="col-form-label">Type:</label>
                            <select  id="createModal-type" class="form-select" data-testid="manager-create-type">
                                <option value="task" selected>Task</option>
                                <option value="library">Library</option>
                                <option value="controller">Controller</option>
                                <option value="view">View</option>
                                <option value="markdown">Markdown</option>
                                <option value="data">Data (YAML)</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger" data-bs-dismiss="modal" title="Discard and close" data-testid="manager-create-cancel">Cancel</button>
                        <button type="button" class="btn btn-primary" onclick="onCreate()" data-bs-target="#createModal" title="Create the scriptlet" data-testid="manager-create-submit">Create</button>
                        <button type="button" class="btn btn-secondary" onclick="onCreate(true)" data-bs-target="#createModal" title="Create the scriptlet and open it in the editor" data-testid="manager-create-edit">Create & Edit</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
