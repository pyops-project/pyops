<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

        <link rel="stylesheet" href="/files/css/bootstrap/bootstrap.min.css">
        <link rel="stylesheet" href="/files/css/material/material-icons.css">

        <script src="/files/js/jquery.min.js"></script>
        <script src="/files/js/js.cookie.min.js"></script>
        <script src="/files/js/bootstrap/bootstrap.bundle.min.js"></script>

        <script>
            const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
            function setTheme(e) {
                const body = document.body;
                const table = document.querySelector('table');
                if (e.matches) {
                    document.documentElement.setAttribute('data-bs-theme', 'dark');
                    body.classList.remove('bg-body');
                    body.classList.add('bg-dark');
                    if (table) {
                        table.classList.remove('table-secondary');
                        table.classList.add('table-dark');
                    }
                } else {
                    document.documentElement.setAttribute('data-bs-theme', 'light');
                    body.classList.remove('bg-dark');
                    body.classList.add('bg-body');
                    if (table) {
                        table.classList.remove('table-dark');
                        table.classList.add('table-secondary');
                    }
                }
            }
            mediaQuery.addEventListener('change', setTheme);
            $(document).ready(function() {
                setTheme(mediaQuery);
            });
        </script>

        <script>
            'use strict';

            function genCloneModal() {
                return `
                    <div class="modal fade" data-bs-backdrop="static" id="cloneModal" tabindex="-1" aria-labelledby="cloneModalLabel" aria-hidden="true" data-testid="sets-clone-modal">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title" id="cloneModalLabel">Clone Set</h5>
                                    <p id="cloneModal-error" class="text-danger" data-testid="sets-clone-error"></p>
                                </div>
                                <div class="modal-body">
                                    <div class="mb-3">
                                        <label for="cloneModal-url" class="col-form-label">URL:</label>
                                        <input id="cloneModal-url" type="text" class="form-control" data-testid="sets-clone-url">
                                    </div>
                                    <div class="mb-3">
                                        <label for="cloneModal-username" class="col-form-label">Username (optional):</label>
                                        <input id="cloneModal-username" type="text" class="form-control" data-testid="sets-clone-username">
                                    </div>
                                    <div class="mb-3">
                                        <label for="cloneModal-password" class="col-form-label">Password (optional):</label>
                                        <input id="cloneModal-password" type="password" class="form-control" data-testid="sets-clone-password">
                                    </div>
                                    <div class="mb-3">
                                        <label for="cloneModal-git_name" class="col-form-label">Git Name:</label>
                                        <input id="cloneModal-git_name" type="text" class="form-control" data-testid="sets-clone-git-name">
                                    </div>
                                    <div class="mb-3">
                                        <label for="cloneModal-git_email" class="col-form-label">Git Email:</label>
                                        <input id="cloneModal-git_email" type="text" class="form-control" data-testid="sets-clone-git-email">
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal" data-testid="sets-clone-cancel">Cancel</button>
                                    <button type="button" class="btn btn-primary" onclick="onClone()" data-testid="sets-clone-submit">Clone</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            function genSwitchModal() {
                return `
                    <div class="modal fade" data-bs-backdrop="static" id="switchModal" tabindex="-1" aria-labelledby="switchModalLabel" aria-hidden="true" data-testid="sets-switch-modal">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title" id="switchModalLabel">Switch Branch</h5>
                                    <p id="switchModal-error" class="text-danger" data-testid="sets-switch-error"></p>
                                </div>
                                <div class="modal-body">
                                    <div class="mb-3">
                                        <label for="switchModal-name" class="col-form-label">Set:</label>
                                        <select id="switchModal-name" class="form-select" disabled data-testid="sets-switch-name"></select>
                                    </div>
                                    <div class="mb-3">
                                        <label for="switchModal-branch" class="col-form-label">Branch:</label>
                                        <input type="text" id="switchModal-branch" class="form-control" list="branchSuggestions" data-testid="sets-switch-branch">
                                        <datalist id="branchSuggestions"></datalist>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal" data-testid="sets-switch-cancel">Cancel</button>
                                    <button type="button" class="btn btn-primary" onclick="onSwitch()" data-testid="sets-switch-submit">Switch</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            function genActions(name, branch) {
                return `
                    <button type="button" onclick="onPull('${name}')" class="btn btn-primary p-0" data-testid="set-pull-${name}">
                        <span class="material-icons-round">sync</span>
                    </button>
                    <button type="button" onclick="onSwitchBranch('${name}')" class="btn btn-warning p-0" data-testid="set-switch-${name}">
                        <span class="material-icons-round">swap_horiz</span>
                    </button>
                    <button type="button" onclick="onRemove('${name}')" class="btn btn-danger p-0" data-testid="set-remove-${name}">
                        <span class="material-icons-round">delete</span>
                    </button>
                `;
            }

            function genSetRowContent(name, branch) {
                return `
                    <th scope="row">${name}</th>
                    <th scope="row">${branch}</th>
                    <td>${genActions(name, branch)}</td>
                `;
            }

            function getRowKey(row) {
                return $(row).data("name");
            }

            function genSetItem(name, branch) {
                return `<tr data-name="${name}" data-testid="set-row-${name}">${genSetRowContent(name, branch)}</tr>`;
            }

            function refreshList() {
                const scrollY = window.scrollY;
                fetch("/scriptlet/sets/list").then(async (r)=>{
                    console.debug("GET", "/scriptlet/sets/list", r)
                    if(r.ok) {
                        const d = await r.json();
                        console.debug("sets", d);
                        const tbody = $("#sets");
                        const existingRows = {};
                        tbody.find("tr").each(function() {
                            const name = $(this).data("name");
                            if(name) existingRows[name] = this;
                        });
                        const newKeys = new Set();
                        for(const i of d.sets) {
                            const key = i.name;
                            newKeys.add(key);
                            if(existingRows[key]) {
                                $(existingRows[key]).html(genSetRowContent(i.name, i.branch));
                            } else {
                                const newRowHtml = genSetItem(i.name, i.branch);
                                let inserted = false;
                                tbody.find("tr").each(function() {
                                    const existingKey = getRowKey(this);
                                    if (!inserted && key < existingKey) {
                                        $(this).before(newRowHtml);
                                        inserted = true;
                                        return false;
                                    }
                                });
                                if (!inserted) tbody.append(newRowHtml);
                            }
                        }
                        tbody.find("tr").each(function() {
                            const name = $(this).data("name");
                            if(name && !newKeys.has(name)) $(this).remove();
                        });
                        window.scrollTo(0, scrollY);
                    } else
                        console.error("GET", "/scriptlet/sets/list", r.statusText);
                }).catch((e)=>console.error("GET", "/scriptlet/sets/list", e.toString()));
            }

            function enqueueRefreshList() {
                setTimeout(function() { refreshList(); }, 500);
            }

            function genCreateModal() {
                return `
                    <div class="modal fade" data-bs-backdrop="static" id="createModal" tabindex="-1" aria-labelledby="createModalLabel" aria-hidden="true" data-testid="sets-create-modal">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title" id="createModalLabel">Create Set</h5>
                                    <p id="createModal-error" class="text-danger" data-testid="sets-create-error"></p>
                                </div>
                                <div class="modal-body">
                                    <div class="mb-3">
                                        <label for="createModal-name" class="col-form-label">Name:</label>
                                        <input id="createModal-name" type="text" class="form-control" data-testid="sets-create-name">
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal" data-testid="sets-create-cancel">Cancel</button>
                                    <button type="button" class="btn btn-primary" onclick="onCreate()" data-testid="sets-create-submit">Create</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            function clearCloneModal() {
                $("#cloneModal-error").text("");
                $("#cloneModal-url").val("");
                $("#cloneModal-username").val("");
                $("#cloneModal-password").val("");
                $("#cloneModal-git_name").val("");
                $("#cloneModal-git_email").val("");
            }

            function clearCreateModal() {
                $("#createModal-error").text("");
                $("#createModal-name").val("");
            }

            function onClone() {
                const url = $("#cloneModal-url").val();
                const username = $("#cloneModal-username").val();
                const password = $("#cloneModal-password").val();
                const git_name = $("#cloneModal-git_name").val();
                const git_email = $("#cloneModal-git_email").val();

                if (!url) {
                    $("#cloneModal-error").text("Please provide URL");
                    return;
                }

                const data = {
                    "url": url,
                    "username": username,
                    "password": password,
                    "git_name": git_name,
                    "git_email": git_email
                };

                console.debug("POST", "/scriptlet/sets/clone", data);

                fetch("/scriptlet/sets/clone", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                }).then(async (r)=>{
                    if(r.ok) {
                        $("#cloneModal").modal('hide');
                        clearCloneModal();
                        enqueueRefreshList();
                    } else {
                        const d = await r.json();
                        $("#cloneModal-error").text(d.detail);
                    }
                }).catch((e)=>$("#cloneModal-error").text(e.toString()));
            }

            function onCreate() {
                const name = $("#createModal-name").val();

                if (!name) {
                    $("#createModal-error").text("Please provide name");
                    return;
                }

                const data = {
                    "name": name
                };

                console.debug("POST", "/scriptlet/sets/create", data);

                fetch("/scriptlet/sets/create", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                }).then(async (r)=>{
                    if(r.ok) {
                        $("#createModal").modal('hide');
                        clearCreateModal();
                        enqueueRefreshList();
                    } else {
                        const d = await r.json();
                        $("#createModal-error").text(d.detail);
                    }
                }).catch((e)=>$("#createModal-error").text(e.toString()));
            }

            function populateSwitchBranches(name) {
                $("#switchModal-name").empty().append(`<option value="${name}">${name}</option>`).val(name);
                $("#branchSuggestions").empty();
            }

            function onSwitchBranch(name) {
                populateSwitchBranches(name);
                $("#switchModal").modal('show');
            }

            function onSwitch() {
                const name = $("#switchModal-name").val();
                const branch = $("#switchModal-branch").val();

                if (!name) {
                    $("#switchModal-error").text("Please select set");
                    return;
                }

                if (!branch) {
                    $("#switchModal-error").text("Please select branch");
                    return;
                }

                const data = {
                    "name": name,
                    "branch": branch
                };

                console.debug("POST", "/scriptlet/sets/switch", data);

                fetch("/scriptlet/sets/switch", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                }).then(async (r)=>{
                    if(r.ok) {
                        $("#switchModal").modal('hide');
                        enqueueRefreshList();
                    } else {
                        const d = await r.json();
                        $("#switchModal-error").text(d.detail);
                    }
                }).catch((e)=>$("#switchModal-error").text(e.toString()));
            }

            function onPull(name) {
                console.debug("onPull", name);

                fetch(`/scriptlet/sets/pull/${name}`, {
                    method: "POST"
                }).then(async (r)=>{
                    if(r.ok)
                        enqueueRefreshList();
                    else
                        console.error("POST", `/scriptlet/sets/pull/${name}`, r.statusText);
                }).catch((e)=>console.error("POST", `/scriptlet/sets/pull/${name}`, e.toString()));
            }

            function onRemove(name) {
                console.debug("onRemove", name);

                if(window.confirm(`are you sure you want to remove set ${name}`)) {
                    console.debug("DELETE", `/scriptlet/sets/remove/${name}`);

                    fetch(`/scriptlet/sets/remove/${name}`, {
                        method: "DELETE"
                    }).then(async (r)=>{
                        if(r.ok)
                            enqueueRefreshList();
                        else
                            console.error("DELETE", `/scriptlet/sets/remove/${name}`, r.statusText);
                    }).catch((e)=>console.error("DELETE", `/scriptlet/sets/remove/${name}`, e.toString()));
                }
            }

            $(document).ready(() => {
                refreshList();
                setInterval(function() {
                    refreshList();
                }, 10000);

                // Modals
                $("body").append(genCloneModal());
                $("body").append(genCreateModal());
                $("body").append(genSwitchModal());

                // Show clone modal on clone button
                $("#cloneButton").on('click', function () {
                    clearCloneModal();
                    $("#cloneModal").modal('show');
                });

                // Show create modal on create button
                $("#createButton").on('click', function () {
                    clearCreateModal();
                    $("#createModal").modal('show');
                });
            });
        </script>
    </head>
    <body class="bg-body">
        <nav class="navbar navbar-expand navbar-dark bg-dark pt-3 sticky-top" data-testid="sets-navbar">
            <ul class="navbar-nav w-100">
                <li class="navbar-brand">
                    <span class="material-icons-round">folder</span>
                    <span>Sets Manager</span>
                </li>

                <li class="nav-item m-1">
                    <button type="button" id="cloneButton" class="btn btn-success" data-testid="sets-clone">
                        <span class="material-icons-round">content_copy</span>
                    </button>
                </li>
                <li class="nav-item m-1">
                    <button type="button" id="createButton" class="btn btn-success" data-testid="sets-create">
                        <span class="material-icons-round">add</span>
                    </button>
                </li>

                <li class="nav-item mx-auto"></li>

                <li class="nav-item m-1">
                    <button type="button" class="btn btn-success" onclick="refreshList()" data-testid="sets-refresh">
                        <span class="material-icons-round">refresh</span>
                    </button>
                </li>
            </ul>
        </nav>

        <table class="table table-secondary" data-testid="sets-table">
            <thead>
              <tr>
                <th scope="col">Name</th>
                <th scope="col">Branch</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody id="sets" data-testid="sets-rows">
            </tbody>
        </table>
    </body>
</html>
