<html>
    <head>
        <title>InfraOps</title>

        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

		<link rel="stylesheet" href="/files/css/bootstrap/bootstrap.min.css">
        <link rel="stylesheet" href="/files/css/material/material-icons.css">

        <script src="/files/js/jquery.min.js"></script>
        <script src="/files/js/js.cookie.min.js"></script>
        <script src="/files/js/bootstrap/bootstrap.bundle.min.js"></script>

        <script>
            'use strict';

            const urlParams = new URLSearchParams(window.location.search);
            var goto = urlParams.get("goto");

            function genMenuItem(id, name) {
                return `
                    <li id="${id}">
                        <button type="button" class="btn btn-toggle btn-primary w-100" data-bs-toggle="collapse" data-bs-target="#${id}-collapse" aria-expanded="true">
                            ${name}
                        </button>
                        <div id="${id}-collapse" class="collapse show">
                            <ul id="submenu_${id}" class="btn-toggle-nav list-unstyled">
                                
                            </ul>
                        </div>
                    </li>
                `;
            }

            function unsetActive() {
                if(goto) {
                    $("#btn_"+goto).removeClass("btn-warning");
                    $("#btn_"+goto).addClass("btn-secondary");
                }
            }

            function setActive(id) {
                unsetActive()

                goto = id
                $("#btn_"+id).removeClass("btn-secondary");
                $("#btn_"+id).addClass("btn-warning");
            }

            function genSubmenuItem(parent, id, name, path) {
                //  onclick="window.location.replace(window.location.origin+'/?goto=${id}')"
                return `
                    <li id="${id}">
                        <a id="btn_${id}" class="btn btn-secondary w-100 p-0" onclick="history.replaceState('${id}', '', '/?goto=${id}'); setActive('${id}');" href="${path}" target="frame">${name}</a>
                    </li>
                `;
            }

            $(document).ready(() => {
                fetch("/menu").then(async (r)=>{
                    if(r.ok) {
                        const d = await r.json();
                        console.debug("menu", d);
                        for(const i of d) {
                            $("#menu").append(genMenuItem(i.id, i.name));

                            for(const si of i.items) {
                                $("#submenu_"+i.id).append(genSubmenuItem(i.name, si.id, si.name, si.path));
                                if(!goto && si.default)
                                    $("#btn_"+si.id).get(0).click()
                            }
                        }

                        if(goto && $("#btn_"+goto).length > 0)
                            $("#btn_"+goto).get(0).click();
                    } else
                        console.error("GET", "/menu", r.statusText);
                }).catch((e)=>console.error("GET", "/menu", e.toString()));
            });
        </script>
    </head>
    <body>
        <div class="d-flex h-100">
            <div class="p-3 bg-dark text-light" style="width: 280px">
                <p>
                    <span class="material-icons-round text-icon mt-1">miscellaneous_services</span>
                    <span class="fs-5">InfraOps</span>
                </p>
                <hr>
                <ul id="menu" class="list-unstyled" />
            </div>
            <div class="w-100">
                <iframe id="frame" name="frame" class="h-100 w-100" />
            </div>
        </div>
    </body>
</html>
