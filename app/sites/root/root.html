<!doctype html>
<html lang="en">
    <head>
        <title>{{BRAND_TITLE}}</title>

        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

        <link rel="stylesheet" href="/files/css/bootstrap/bootstrap.min.css">
        <link rel="stylesheet" href="/files/css/material/material-icons.css">

        <script src="/files/js/jquery.min.js"></script>
        <script src="/files/js/js.cookie.min.js"></script>
        <script src="/files/js/bootstrap/bootstrap.bundle.min.js"></script>
        <script src="/files/js/pyops-html.js"></script>

        <style>
            html, body { height: 100%; margin: 0; }

            #sidebarOffcanvas {
                width: 280px;
                --bs-offcanvas-width: 280px;
            }
            #sidebarOffcanvas .pyops-brand {
                padding: 0.75rem 1rem;
                border-bottom: 1px solid rgba(255,255,255,0.15);
            }

            /* Brand icon. Three renderers all share .pyops-brand-icon so
               the brand row keeps its layout:
                 - default: a material-icons-round glyph span (sized by
                   the icon font's font-size),
                 - raster image: img tag served from /brand/icon,
                 - SVG: span wrapping inline <svg> so it inherits
                   currentColor and follows the brand text color exactly
                   like the material-icons glyph does. */
            .pyops-brand-icon {
                display: inline-flex;
                width: 1.5rem;
                height: 1.5rem;
                vertical-align: middle;
                color: inherit;
            }
            img.pyops-brand-icon {
                object-fit: contain;
            }
            span.pyops-brand-icon > svg {
                width: 100%;
                height: 100%;
                fill: currentColor;
            }
            #menu {
                padding: 0.25rem 0.5rem;
                overflow-y: auto;
            }

            /* Section toggle — looks like a section label, collapses
               the nav-pills below it. Chevron rotates with state.
               Built-in "Scriptlet" section is a btn-primary; user-set
               (hosted) sections are btn-secondary. */
            .pyops-section-toggle {
                display: flex;
                align-items: center;
                width: 100%;
                border: 0;
                background-color: var(--bs-secondary);
                color: #fff;
                font-size: 0.72rem;
                font-weight: 600;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                padding: 0.4rem 0.5rem;
                text-align: left;
                border-radius: 0.25rem;
            }
            [data-testid="menu-toggle-scriptlet"].pyops-section-toggle {
                background-color: var(--bs-primary);
            }
            .pyops-section-toggle:hover,
            .pyops-section-toggle:focus {
                filter: brightness(1.15);
                color: #fff;
                outline: none;
            }
            .pyops-section-toggle .pyops-chevron {
                font-size: 1rem;
                margin-right: 0.25rem;
                transition: transform 0.15s ease;
            }
            .pyops-section-toggle[aria-expanded="false"] .pyops-chevron {
                transform: rotate(-90deg);
            }

            /* Nav items */
            #menu .nav-link {
                color: rgba(255,255,255,0.85);
                padding: 0.25rem 0.6rem 0.25rem 1.5rem;
                border-radius: 0.25rem;
                font-size: 0.9rem;
                line-height: 1.4;
            }
            #menu .nav-link:hover,
            #menu .nav-link:focus {
                color: #fff;
                background-color: rgba(255,255,255,0.08);
            }
            #menu .nav-link.active {
                color: #000;
                background-color: var(--bs-warning);
            }

            /* Failures block — shown below the nav when /menu returns any. */
            .pyops-failures {
                margin: 0.5rem;
                padding: 0.5rem 0.75rem;
                background-color: var(--bs-danger);
                color: #fff;
                border-radius: 0.25rem;
                font-size: 0.8rem;
            }
            .pyops-failures h6 {
                font-size: 0.8rem;
                margin: 0 0 0.25rem 0;
                display: flex;
                align-items: center;
                gap: 0.25rem;
            }
            .pyops-failures ul {
                padding-left: 1rem;
                margin: 0;
            }

            /* Collapsible sidebar. The aside is a plain Bootstrap offcanvas.
               At >=lg it normally renders statically in-flow (the rail); once
               the user collapses it (body.sidebar-collapsed) it falls back to
               real offcanvas behaviour — the mobile presentation — and the top
               bar appears so the brand-icon button can reopen it as an overlay. */
            @media (min-width: 992px) {
                body:not(.sidebar-collapsed) #sidebarOffcanvas {
                    visibility: visible !important;
                    transform: none !important;
                    position: relative;
                    z-index: auto;
                    /* Drop the offcanvas's 1px translucent right border —
                       it shows as a white seam against the content in the
                       pinned rail (offcanvas-lg zeroes it the same way). */
                    --bs-offcanvas-border-width: 0;
                    border-right: 0;
                }
                body.sidebar-collapsed [data-testid="mobile-topbar"] {
                    display: flex !important;
                }
            }
            /* The topbar toggle shows the brand icon, not the hamburger. */
            [data-testid="sidebar-toggle"] .pyops-brand-icon {
                width: 1.75rem;
                height: 1.75rem;
            }
        </style>

        <script>
            'use strict';

            const urlParams = new URLSearchParams(window.location.search);
            var goto = urlParams.get("goto");

            function genMenuSection(id, name, expanded) {
                const open = !!expanded;
                return `
                    <div class="mb-1" data-testid="menu-section-${id}">
                        <button class="pyops-section-toggle" type="button"
                                data-bs-toggle="collapse" data-bs-target="#section_${id}"
                                aria-expanded="${open}" aria-controls="section_${id}"
                                title="Expand/collapse this section" data-testid="menu-toggle-${id}">
                            <span class="material-icons-round pyops-chevron" aria-hidden="true">expand_more</span>
                            <span>${name}</span>
                        </button>
                        <ul id="section_${id}" class="${open ? 'collapse show' : 'collapse'} list-unstyled mb-0"></ul>
                    </div>
                `;
            }

            function genMenuItem(parent, id, name, path) {
                return `
                    <li data-testid="menu-item-${id}">
                        <a id="btn_${id}" class="nav-link d-block"
                           onclick="onMenuItemClick('${id}')"
                           href="${path}" target="frame"
                           data-testid="menu-link-${id}">${name}</a>
                    </li>
                `;
            }

            // Collapse / expand the desktop sidebar. Collapsed, the layout
            // falls back to the mobile presentation (top bar + offcanvas
            // overlay); the state is remembered across reloads. On either
            // transition, clear any lingering offcanvas 'show'/backdrop.
            function toggleSidebarCollapsed() {
                const collapsed = !document.body.classList.contains('sidebar-collapsed');
                document.body.classList.toggle('sidebar-collapsed', collapsed);
                try { localStorage.setItem('pyops.sidebarCollapsed', collapsed ? '1' : '0'); } catch (e) {}
                const el = document.getElementById('sidebarOffcanvas');
                const inst = bootstrap.Offcanvas.getInstance(el);
                if (inst && el.classList.contains('show')) inst.hide();
            }

            function onMenuItemClick(id) {
                history.replaceState(id, '', '/?goto=' + id);
                setActive(id);
                // On mobile the offcanvas is open over the iframe — close it
                // after the user picks an item. On lg+ the offcanvas isn't in
                // an "open" state at all, so getInstance returns null and this
                // is a no-op.
                const el = document.getElementById('sidebarOffcanvas');
                const inst = bootstrap.Offcanvas.getInstance(el);
                if (inst && el.classList.contains('show')) inst.hide();
            }

            function setActive(id) {
                document.querySelectorAll('#menu .nav-link').forEach((a) => a.classList.remove('active'));
                const el = document.getElementById('btn_' + id);
                if (el) el.classList.add('active');
                goto = id;
            }

            function renderFailures(failures) {
                if (!failures || failures.length === 0) return '';
                const { esc } = window.pyopsHtml;
                let html = '<div class="pyops-failures"><h6><span class="material-icons-round">error</span>Draft Errors</h6><ul>';
                for (const f of failures) {
                    html += `<li><strong>${esc(f.set)}::${esc(f.name)}:</strong> ${esc(f.error)}</li>`;
                }
                html += '</ul></div>';
                return html;
            }

            $(document).ready(() => {
                // Restore the remembered sidebar-collapsed state.
                try {
                    if (localStorage.getItem('pyops.sidebarCollapsed') === '1')
                        document.body.classList.add('sidebar-collapsed');
                } catch (e) {}

                // Snapshot whether the URL carried a goto so we don't
                // double-click below: setActive() flips the global `goto`
                // when an item is clicked, which would otherwise make the
                // post-loop branch fire a second navigation on top of the
                // default-item click and the iframe would load twice (the
                // first load gets cancelled by the second — visible flash
                // and slower first paint).
                const gotoFromUrl = goto;
                fetch("/menu").then(async (r) => {
                    if (!r.ok) {
                        console.error("GET", "/menu", r.statusText);
                        return;
                    }
                    const d = await r.json();
                    const menu = document.getElementById('menu');
                    for (const section of d.menu) {
                        menu.insertAdjacentHTML('beforeend', genMenuSection(section.id, section.name, section.expanded));
                        const list = document.getElementById('section_' + section.id);
                        for (const item of section.items) {
                            list.insertAdjacentHTML('beforeend', genMenuItem(section.name, item.id, item.name, item.path));
                            if (!gotoFromUrl && item.default) {
                                document.getElementById('btn_' + item.id).click();
                            }
                        }
                    }
                    menu.insertAdjacentHTML('beforeend', renderFailures(d.failures));

                    if (gotoFromUrl && document.getElementById('btn_' + gotoFromUrl)) {
                        document.getElementById('btn_' + gotoFromUrl).click();
                    }
                }).catch((e) => console.error("GET", "/menu", e.toString()));
            });
        </script>
    </head>
    <body class="d-flex flex-column h-100">
        <nav class="navbar navbar-dark bg-dark d-lg-none flex-shrink-0" data-testid="mobile-topbar">
            <div class="container-fluid">
                <button class="navbar-toggler border-0 d-flex align-items-center p-1" type="button"
                        data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas"
                        aria-controls="sidebarOffcanvas" aria-label="Toggle navigation"
                        title="Show the navigation sidebar" data-testid="sidebar-toggle">
                    {{BRAND_ICON}}
                </button>
                <span class="navbar-brand mb-0 fs-5">{{BRAND_TITLE}}</span>
            </div>
        </nav>
        <div class="d-flex flex-grow-1 overflow-hidden">
            <aside class="bg-dark text-light offcanvas offcanvas-start flex-shrink-0 d-flex flex-column"
                   tabindex="-1" id="sidebarOffcanvas"
                   aria-labelledby="sidebarOffcanvasLabel" data-testid="sidebar">
                <div class="pyops-brand d-flex align-items-center justify-content-between">
                    <span class="d-flex align-items-center gap-2 fs-5"
                          id="sidebarOffcanvasLabel" data-testid="app-title">
                        {{BRAND_ICON}}
                        <span>{{BRAND_TITLE}}</span>
                    </span>
                    <div class="d-flex align-items-center gap-1">
                        <button id="sidebar-collapse-btn" type="button"
                                class="btn btn-sm btn-dark text-light d-none d-lg-inline-flex align-items-center p-1"
                                onclick="toggleSidebarCollapsed()"
                                title="Collapse / expand the sidebar" data-testid="sidebar-collapse">
                            <span class="material-icons-round">menu_open</span>
                        </button>
                        <button type="button" class="btn-close btn-close-white d-lg-none"
                                data-bs-dismiss="offcanvas" data-bs-target="#sidebarOffcanvas"
                                title="Close the sidebar" aria-label="Close"></button>
                    </div>
                </div>
                <nav id="menu" class="flex-grow-1"
                     data-testid="sidebar-menu" aria-label="Main navigation"></nav>
            </aside>
            <div class="flex-grow-1 h-100">
                <iframe id="frame" name="frame" class="h-100 w-100 border-0" data-testid="content-frame"></iframe>
            </div>
        </div>
    </body>
</html>
