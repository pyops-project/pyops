[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --import-mode=importlib
markers =
    integration: mark an integration test
    unit: mark a unit test
    e2e: mark an end-to-end test
norecursedirs = data
filterwarnings =
    error
    # E2E fixture's gunicorn-stdout log file gets GC'd after subprocess.Popen
    # held it as stdout=. The underlying _io.FileIO occasionally emits an
    # unraisable ResourceWarning during teardown — harmless, the fd is closed
    # by then. Don't fail tests on it.
    ignore::pytest.PytestUnraisableExceptionWarning
    # Test-tooling warning, NOT pyops code. starlette 1.0.1+ raises
    # StarletteDeprecationWarning at module import of starlette.testclient
    # when paired with httpx ("install httpx2 instead"); httpx2 is not on
    # PyPI yet. starlette's warnings.warn(..., stacklevel=2) attributes the
    # call to its IMPORTER — in our chain conftest → fastapi.testclient →
    # starlette.testclient, so the reported module is `fastapi.testclient`,
    # not `starlette.testclient`. Scope the filter to the message regex
    # (unique enough that pyops code could never emit it) so neither a
    # future starlette stacklevel tweak nor a different test-client wrapper
    # quietly slips past — and so `filterwarnings = error` keeps catching
    # warnings emitted by pyops's own code. We match by message regex
    # rather than by category class, so the filter parses cleanly against
    # starlette 1.0.0 (where `StarletteDeprecationWarning` doesn't exist
    # yet) as well as against 1.0.1+ (where it does); pytest fails at
    # config-load time if a referenced category class can't be imported.
    ignore:Using .httpx. with .starlette.testclient. is deprecated
